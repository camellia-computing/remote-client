version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "01:00"
      timezone: Asia/Singapore
    cooldown:
      default-days: 7
    groups:
      rust-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(rust)
    labels:
      - dependencies

  - package-ecosystem: pub
    directory: /flutter
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "01:30"
      timezone: Asia/Singapore
    cooldown:
      default-days: 7
    groups:
      flutter-toolchain:
        patterns:
          - freezed
          - freezed_annotation
          - build_runner
          - ffigen
          - flex_color_picker
          - vector_math
      desktop-platform-plugins:
        patterns:
          - win32
          - win32_registry
          - uni_links_desktop
          - device_info_plus
          - package_info_plus
          - file_picker
          - wakelock_plus
          - desktop_drop
      flutter-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(flutter)
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /flutter/web/js
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Singapore
    cooldown:
      default-days: 7
    groups:
      web-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(web)
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
      timezone: Asia/Singapore
    cooldown:
      default-days: 7
    groups:
      workflow-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps(actions)
    labels:
      - dependencies

  - package-ecosystem: gitsubmodule
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Singapore
    cooldown:
      default-days: 7
    groups:
      git-submodules:
        patterns:
          - "*"
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps(submodules)
    labels:
      - dependencies
