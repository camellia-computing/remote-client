# Vendored from subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
# (v2.23.0). The nested cache action is pinned to an immutable commit.
name: Set up Flutter
description: Set up a runner with an exact Flutter SDK
author: Alif Rachmawadi
branding:
  icon: maximize
  color: blue

inputs:
  channel:
    description: The Flutter build release channel
    required: false
    default: stable
  flutter-version:
    description: The exact Flutter version to make available on the path
    required: true
  flutter-version-file:
    description: The pubspec.yaml or FVM config file with an exact Flutter version
    required: false
    default: ""
  architecture:
    description: The architecture of the Flutter SDK executable (x64 or arm64)
    required: false
    default: "${{ runner.arch }}"
  cache:
    description: Cache the Flutter SDK
    required: false
    default: "false"
  cache-key:
    description: Identifier for the Flutter SDK cache
    required: false
    default: ""
  cache-path:
    description: Flutter SDK cache path
    required: false
    default: ""
  pub-cache:
    description: Cache Dart pub dependencies
    required: false
    default: ""
  pub-cache-key:
    description: Identifier for the Dart pub cache
    required: false
    default: ""
  pub-cache-path:
    description: Flutter pub cache path
    required: false
    default: default
  dry-run:
    description: Resolve outputs without installing Flutter
    required: false
    default: "false"
  git-source:
    description: Git clone source for main/master channel builds
    required: false
    default: "https://github.com/flutter/flutter.git"

outputs:
  CHANNEL:
    value: "${{ steps.flutter-action.outputs.CHANNEL }}"
    description: The selected Flutter release channel
  VERSION:
    value: "${{ steps.flutter-action.outputs.VERSION }}"
    description: The selected Flutter version
  ARCHITECTURE:
    value: "${{ steps.flutter-action.outputs.ARCHITECTURE }}"
    description: The selected Flutter CPU architecture
  CACHE-KEY:
    value: "${{ steps.flutter-action.outputs.CACHE-KEY }}"
    description: Key used to cache the Flutter SDK
  CACHE-PATH:
    value: "${{ steps.flutter-action.outputs.CACHE-PATH }}"
    description: Path to the Flutter SDK
  PUB-CACHE-KEY:
    value: "${{ steps.flutter-action.outputs.PUB-CACHE-KEY }}"
    description: Key used to cache pub dependencies
  PUB-CACHE-PATH:
    value: "${{ steps.flutter-action.outputs.PUB-CACHE-PATH }}"
    description: Path to the pub cache
  GIT_SOURCE:
    value: "${{ steps.flutter-action.outputs.GIT_SOURCE }}"
    description: Flutter SDK Git source
  CACHE-HIT:
    value: "${{ steps.cache-flutter.outputs.cache-hit }}"
    description: Whether the Flutter cache was restored
  PUB-CACHE-HIT:
    value: "${{ steps.cache-pub.outputs.cache-hit }}"
    description: Whether the pub cache was restored

runs:
  using: composite
  steps:
    - name: Make yq available on Windows
      if: runner.os == 'Windows' && inputs.flutter-version-file != '' && !endsWith(inputs.flutter-version-file, '.fvmrc') && !endsWith(inputs.flutter-version-file, 'fvm_config.json')
      shell: bash
      run: choco install yq

    - name: Make setup script executable
      shell: bash
      run: chmod +x "$GITHUB_ACTION_PATH/setup.sh"

    - name: Resolve Flutter inputs
      id: flutter-action
      shell: bash
      run: |
        "$GITHUB_ACTION_PATH/setup.sh" -p \
          -n '${{ inputs.flutter-version }}' \
          -f '${{ inputs.flutter-version-file }}' \
          -a '${{ inputs.architecture }}' \
          -k '${{ inputs.cache-key }}' \
          -c '${{ inputs.cache-path }}' \
          -l '${{ inputs.pub-cache-key }}' \
          -d '${{ inputs.pub-cache-path }}' \
          -g '${{ inputs.git-source }}' \
          '${{ inputs.channel }}'

    - name: Cache Flutter
      id: cache-flutter
      if: ${{ inputs.cache == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.flutter-action.outputs.CACHE-PATH }}
        key: ${{ steps.flutter-action.outputs.CACHE-KEY }}

    - name: Cache pub dependencies
      id: cache-pub
      if: ${{ (inputs.pub-cache == '' && inputs.cache == 'true') || inputs.pub-cache == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.flutter-action.outputs.PUB-CACHE-PATH }}
        key: ${{ steps.flutter-action.outputs.PUB-CACHE-KEY }}-${{ hashFiles('**/pubspec.lock') }}

    - name: Install Flutter
      if: ${{ inputs.dry-run != 'true' && inputs.dry-run != true }}
      shell: bash
      run: |
        "$GITHUB_ACTION_PATH/setup.sh" \
          -n '${{ steps.flutter-action.outputs.VERSION }}' \
          -a '${{ steps.flutter-action.outputs.ARCHITECTURE }}' \
          -c '${{ steps.flutter-action.outputs.CACHE-PATH }}' \
          -d '${{ steps.flutter-action.outputs.PUB-CACHE-PATH }}' \
          '${{ steps.flutter-action.outputs.CHANNEL }}'
