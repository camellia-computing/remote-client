name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing managed release tag to recover
        required: true
        type: string

permissions:
  contents: read
  actions: read # Bind publication to exact CI and frozen candidate artifacts.

concurrency:
  group: release
  cancel-in-progress: false

env:
  CAMELLIA_REMOTE_DOCS_HOME_URL: ${{ github.server_url }}/${{ github.repository }}
  CAMELLIA_REMOTE_LINUX_DISPLAY_DOCS_URL: ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/platform-notes.md#linux-display-requirements
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.1"
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: "3.44.5"
  FLUTTER_REVISION: f94f4fc76b4d74543ed9b085bbd75341ef65de22
  COCOAPODS_VERSION: "1.17.0"
  NODE_VERSION: "24.18.0"
  ANDROID_NDK_VERSION: "28.2.13676358"
  IOS_BUNDLE_ID: com.camellia.remote
  DEPENDENCY_MODE: locked
  VCPKG_BINARY_SOURCES: clear
  RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
  RENDEZVOUS_SERVERS: ${{ vars.RENDEZVOUS_SERVERS || secrets.RENDEZVOUS_SERVERS }}
  API_SERVER: ${{ vars.API_SERVER || secrets.API_SERVER }}

jobs:
  prepare:
    name: Authorize release source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read # Bind authorization to the exact successful validation run.
      contents: read
      pull-requests: read # Revalidate the managed Release PR and exact head.
    outputs:
      bridge_artifact: ${{ steps.ci.outputs.bridge-artifact }}
      camellia_remote_protocol: ${{ steps.source.outputs.protocol }}
      ci_run_id: ${{ steps.release.outputs.validation-run-id }}
      commit: ${{ steps.source.outputs.sha }}
      release_complete: ${{ steps.release.outputs.release-complete }}
      release_digest: ${{ steps.release.outputs.release-digest }}
      release_draft: ${{ steps.release.outputs.release-draft }}
      release_id: ${{ steps.release.outputs.release-id }}
      release_pr_number: ${{ steps.release.outputs.release-pr-number }}
      signing_identity: ${{ steps.source.outputs.signing-identity }}
      source_date_epoch: ${{ steps.source.outputs.source-date-epoch }}
      version: ${{ steps.version.outputs.version }}
      app_version: ${{ steps.version.outputs.app_version }}
      build_number: ${{ steps.version.outputs.build_number }}
      release_tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          submodules: recursive
      - name: Validate version
        id: version
        run: python3 .github/scripts/release_metadata.py --github-output
      - name: Validate source and workflow identity
        id: source
        env:
          EXPECTED_TAG: ${{ steps.version.outputs.tag }}
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          TRIGGER_REF: ${{ github.ref }}
          TRIGGER_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          [[ "$tag" == "$EXPECTED_TAG" ]]
          identity="https://github.com/$WORKFLOW_REF"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$TRIGGER_REF" == refs/heads/main ]]
            git merge-base --is-ancestor "$WORKFLOW_SHA" origin/main
            expected="https://github.com/$GITHUB_REPOSITORY/.github/workflows/publish-release.yml@refs/heads/main"
          else
            [[ "$GITHUB_REF_TYPE" == tag && "$TRIGGER_REF" == "refs/tags/$tag" ]]
            expected="https://github.com/$GITHUB_REPOSITORY/.github/workflows/publish-release.yml@refs/tags/$tag"
          fi
          [[ "$identity" == "$expected" ]]
          sha="$(git rev-list -n 1 "$tag")"
          [[ "$sha" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$sha" ]]
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            [[ "$TRIGGER_SHA" == "$sha" ]]
          fi
          git merge-base --is-ancestor "$sha" origin/main
          protocol="$(
            git ls-tree "$sha" -- libs/camellia_remote_protocol |
              awk '$2 == "commit" {print $3}'
          )"
          [[ "$protocol" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "protocol=$protocol"
            echo "sha=$sha"
            echo "signing-identity=$identity"
            echo "source-date-epoch=$(git show -s --format=%ct "$sha")"
          } >> "$GITHUB_OUTPUT"
      - name: Release authorization token
        id: policy-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          # GitHub exposes full merge policy and draft Releases only to push-capable callers.
          # Trusted authorization controls use this token for read operations only.
          permission-contents: write
          permission-metadata: read
          permission-pull-requests: read
      - name: Trusted authorization control
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            manage-release.py \
            validate-github-release-policy.sh
          do
            git show "$GITHUB_WORKFLOW_SHA:.github/scripts/$script" \
              > "$RUNNER_TEMP/$script"
            chmod 700 "$RUNNER_TEMP/$script"
          done
      - name: Validate hosted release policy
        env:
          GH_TOKEN: ${{ steps.policy-token.outputs.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_APP_SLUG: ${{ steps.policy-token.outputs.app-slug }}
        run: bash "$RUNNER_TEMP/validate-github-release-policy.sh"
      - name: Managed release
        id: release
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.policy-token.outputs.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 "$RUNNER_TEMP/manage-release.py" authorize \
            --version "$VERSION" \
            --sha "$RELEASE_SHA" \
            --tag "$RELEASE_TAG"
      - name: Validate exact CI bridge artifact
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          VALIDATION_RUN_ID: ${{ steps.release.outputs.validation-run-id }}
        shell: bash
        run: |
          set -euo pipefail
          bridge_artifact="bridge-generated-$RELEASE_SHA"
          artifacts_json="$(
            gh api -X GET \
              "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN_ID/artifacts" \
              -f per_page=100
          )"
          artifact_count="$(
            jq -r --arg artifact "$bridge_artifact" \
              '[.artifacts[] | select(.name == $artifact and .expired == false)] | length' \
              <<< "$artifacts_json"
          )"
          if [[ "$artifact_count" != "1" ]]; then
            echo "CI run $VALIDATION_RUN_ID must contain one unexpired $bridge_artifact artifact" >&2
            exit 1
          fi
          echo "bridge-artifact=$bridge_artifact" >> "$GITHUB_OUTPUT"
      - name: Validate release configuration
        run: python3 .github/scripts/validate_build_config.py
      - name: Summarize release candidate
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          CI_RUN_ID: ${{ steps.release.outputs.validation-run-id }}
          RELEASE_COMMIT: ${{ steps.source.outputs.sha }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PROTOCOL_COMMIT: ${{ steps.source.outputs.protocol }}
          RELEASE_DRAFT: ${{ steps.release.outputs.release-draft }}
        run: |
          {
            echo "### Client release candidate"
            echo
            echo "- Version: \`$APP_VERSION\` (\`$RELEASE_TAG\`)"
            echo "- Commit: \`$RELEASE_COMMIT\`"
            echo "- Remote Protocol: \`$PROTOCOL_COMMIT\`"
            echo "- Reused CI run: \`$CI_RUN_ID\`"
            echo "- Draft requires frozen build: \`$RELEASE_DRAFT\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build_windows_x64:
    name: Windows x64
    needs: prepare
    if: ${{ needs.prepare.outputs.release_draft == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare.outputs.bridge_artifact }}
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.ci_run_id }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # zizmor: ignore[superfluous-actions] The pinned action installs the exact Windows x64 target consistently.
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc
      - uses: ./.github/actions/setup-flutter
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          doNotCache: true
          vcpkgDirectory: C:\vcpkg
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
      - name: Resolve Windows signing mode
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERTIFICATE_SHA256: ${{ vars.WINDOWS_CODESIGN_CERTIFICATE_SHA256 || '' }}
          WINDOWS_CODESIGN_CERTIFICATE_THUMBPRINT: ${{ vars.WINDOWS_CODESIGN_CERTIFICATE_THUMBPRINT || '' }}
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 || '' }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD || '' }}
          WINDOWS_SECONDARY_CODESIGN_CERTIFICATE_SHA256: ${{ vars.WINDOWS_SECONDARY_CODESIGN_CERTIFICATE_SHA256 || '' }}
          WINDOWS_SECONDARY_CODESIGN_CERTIFICATE_THUMBPRINT: ${{ vars.WINDOWS_SECONDARY_CODESIGN_CERTIFICATE_THUMBPRINT || '' }}
          WINDOWS_SECONDARY_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_SECONDARY_CODESIGN_PFX_BASE64 || '' }}
          WINDOWS_SECONDARY_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SECONDARY_CODESIGN_PFX_PASSWORD || '' }}
        run: ./.github/scripts/resolve-windows-signing.ps1
      - name: Build
        shell: bash
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows-static
        run: | # zizmor: ignore[template-injection] Prepare emits canonical numeric build metadata from the exact managed tag.
          bash .github/scripts/sync-version.sh \
            "${{ needs.prepare.outputs.version }}" \
            "${{ needs.prepare.outputs.build_number }}" \
            "${{ needs.prepare.outputs.source_date_epoch }}"
          bash .github/scripts/prepare-dependencies.sh "${{ env.DEPENDENCY_MODE }}"
          "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"
          export SODIUM_LIB_DIR="$VCPKG_ROOT/installed/x64-windows-static/lib"
          cargo build --locked --release --lib --features flutter,hwcodec,vram
          (cd flutter && flutter build windows --release)
          mkdir -p artifacts
      - name: Sign and verify Windows application payload
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ env.WINDOWS_SIGNING_GROUP == 'primary' && secrets.WINDOWS_CODESIGN_PFX_PASSWORD || env.WINDOWS_SIGNING_GROUP == 'secondary' && secrets.WINDOWS_SECONDARY_CODESIGN_PFX_PASSWORD || '' }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: |
          $applicationDirectory = 'flutter/build/windows/x64/runner/Release'
          $ownedFiles = @("$applicationDirectory/camellia-remote.exe")
          $nativeLibraries = @(
            Get-ChildItem -LiteralPath $applicationDirectory -Recurse -File -Filter 'camellia_remote.dll'
          )
          if ($nativeLibraries.Count -ne 1) {
            throw "Expected one Camellia native library; found $($nativeLibraries.Count)"
          }
          $ownedFiles += $nativeLibraries.FullName
          ./.github/scripts/sign-windows-artifacts.ps1 -Path $ownedFiles
      - name: Build Windows installers
        shell: pwsh
        run: | # zizmor: ignore[template-injection] Artifact names use the canonical SemVer validated by prepare.
          python -m pip install -r libs/portable/requirements.txt
          python libs/portable/generate.py `
            -f flutter/build/windows/x64/runner/Release `
            -o libs/portable `
            -e camellia-remote.exe `
            -t x86_64-pc-windows-msvc
          Copy-Item target/x86_64-pc-windows-msvc/release/camellia-remote-portable-packer.exe `
            artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-windows-x64-portable.exe
          Push-Location res/msi
          python preprocess.py --arp `
            --architecture x64 --app-name "Camellia Remote" `
            -v "${{ needs.prepare.outputs.version }}"
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          Copy-Item $msi.FullName ../../artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-windows-x64.msi
          Pop-Location
      - name: Sign and verify Windows artifacts
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ env.WINDOWS_SIGNING_GROUP == 'primary' && secrets.WINDOWS_CODESIGN_PFX_PASSWORD || env.WINDOWS_SIGNING_GROUP == 'secondary' && secrets.WINDOWS_SECONDARY_CODESIGN_PFX_PASSWORD || '' }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: | # zizmor: ignore[template-injection] Artifact names use the canonical SemVer validated by prepare.
          $ownedFiles = @(
            'artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-windows-x64-portable.exe',
            'artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-windows-x64.msi'
          )
          ./.github/scripts/sign-windows-artifacts.ps1 -Path $ownedFiles
      - name: Package Windows artifacts and signing metadata
        shell: pwsh
        run: | # zizmor: ignore[template-injection] Artifact names use the canonical SemVer validated by prepare.
          Compress-Archive `
            -Path 'flutter/build/windows/x64/runner/Release/*' `
            -DestinationPath 'artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-windows-x64.zip' `
            -Force
          $metadata = @(
            '.github/scripts/signing_metadata.py',
            'write',
            '--output', 'artifacts/native-signing-windows-x64.json',
            '--artifact-directory', 'artifacts',
            '--platform', 'windows',
            '--architecture', 'x64',
            '--native-signing', $env:WINDOWS_NATIVE_SIGNING,
            '--distribution-trust', $env:WINDOWS_DISTRIBUTION_TRUST,
            '--delivery', 'installable'
          )
          if ($env:WINDOWS_SIGNING_IDENTITY) {
            $metadata += @('--identity', $env:WINDOWS_SIGNING_IDENTITY)
          }
          python @metadata
      - name: Remove Windows signing material
        if: always()
        shell: pwsh
        run: |
          if ($env:WINDOWS_SIGNING_PFX_PATH) {
            Remove-Item -LiteralPath $env:WINDOWS_SIGNING_PFX_PATH -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: camellia-remote-${{ needs.prepare.outputs.version }}-windows-x64-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  build_windows_arm64:
    name: Windows arm64
    needs: prepare
    if: ${{ needs.prepare.outputs.release_draft == 'true' }}
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare.outputs.bridge_artifact }}
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.ci_run_id }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # zizmor: ignore[superfluous-actions] The pinned action installs the exact Windows ARM64 target consistently.
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-pc-windows-msvc
      - name: Install Flutter stable from source
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:FLUTTER_VERSION https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          $revision = (git -C "$env:RUNNER_TEMP\flutter" rev-parse HEAD).Trim()
          if ($revision -ne $env:FLUTTER_REVISION) {
            throw "Unexpected Flutter revision: $revision"
          }
          "FLUTTER_ROOT=$env:RUNNER_TEMP\flutter" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Precache Flutter Windows
        shell: pwsh
        run: flutter.bat precache --windows
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          doNotCache: true
          vcpkgDirectory: C:\vcpkg
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
      - name: Resolve Windows signing mode
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERTIFICATE_SHA256: ${{ vars.WINDOWS_CODESIGN_CERTIFICATE_SHA256 || '' }}
          WINDOWS_CODESIGN_CERTIFICATE_THUMBPRINT: ${{ vars.WINDOWS_CODESIGN_CERTIFICATE_THUMBPRINT || '' }}
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 || '' }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD || '' }}
          WINDOWS_SECONDARY_CODESIGN_CERTIFICATE_SHA256: ${{ vars.WINDOWS_SECONDARY_CODESIGN_CERTIFICATE_SHA256 || '' }}
          WINDOWS_SECONDARY_CODESIGN_CERTIFICATE_THUMBPRINT: ${{ vars.WINDOWS_SECONDARY_CODESIGN_CERTIFICATE_THUMBPRINT || '' }}
          WINDOWS_SECONDARY_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_SECONDARY_CODESIGN_PFX_BASE64 || '' }}
          WINDOWS_SECONDARY_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SECONDARY_CODESIGN_PFX_PASSWORD || '' }}
        run: ./.github/scripts/resolve-windows-signing.ps1
      - name: Build
        shell: bash
        env:
          VCPKG_DEFAULT_TRIPLET: arm64-windows-static
        run: | # zizmor: ignore[template-injection] Prepare emits canonical numeric build metadata from the exact managed tag.
          bash .github/scripts/sync-version.sh \
            "${{ needs.prepare.outputs.version }}" \
            "${{ needs.prepare.outputs.build_number }}" \
            "${{ needs.prepare.outputs.source_date_epoch }}"
          bash .github/scripts/prepare-dependencies.sh "${{ env.DEPENDENCY_MODE }}"
          "$VCPKG_ROOT/vcpkg" install --triplet arm64-windows-static --x-install-root="$VCPKG_ROOT/installed"
          export SODIUM_LIB_DIR="$VCPKG_ROOT/installed/arm64-windows-static/lib"
          cargo build --locked --release --target aarch64-pc-windows-msvc --lib --features flutter,hwcodec
          mkdir -p target/release
          cp target/aarch64-pc-windows-msvc/release/camellia_remote.dll target/release/camellia_remote.dll
          (cd flutter && flutter.bat build windows --release)
          mkdir -p artifacts
      - name: Sign and verify Windows application payload
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ env.WINDOWS_SIGNING_GROUP == 'primary' && secrets.WINDOWS_CODESIGN_PFX_PASSWORD || env.WINDOWS_SIGNING_GROUP == 'secondary' && secrets.WINDOWS_SECONDARY_CODESIGN_PFX_PASSWORD || '' }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: |
          $applicationDirectory = 'flutter/build/windows/arm64/runner/Release'
          $ownedFiles = @("$applicationDirectory/camellia-remote.exe")
          $nativeLibraries = @(
            Get-ChildItem -LiteralPath $applicationDirectory -Recurse -File -Filter 'camellia_remote.dll'
          )
          if ($nativeLibraries.Count -ne 1) {
            throw "Expected one Camellia native library; found $($nativeLibraries.Count)"
          }
          $ownedFiles += $nativeLibraries.FullName
          ./.github/scripts/sign-windows-artifacts.ps1 -Path $ownedFiles
      - name: Build Windows installers
        shell: pwsh
        run: | # zizmor: ignore[template-injection] Artifact names use the canonical SemVer validated by prepare.
          python -m pip install -r libs/portable/requirements.txt
          python libs/portable/generate.py `
            -f flutter/build/windows/arm64/runner/Release `
            -o libs/portable `
            -e camellia-remote.exe `
            -t aarch64-pc-windows-msvc
          Copy-Item target/aarch64-pc-windows-msvc/release/camellia-remote-portable-packer.exe `
            artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-windows-arm64-portable.exe
          Push-Location res/msi
          python preprocess.py --arp `
            --architecture arm64 --app-name "Camellia Remote" `
            -v "${{ needs.prepare.outputs.version }}"
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=ARM64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          Copy-Item $msi.FullName ../../artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-windows-arm64.msi
          Pop-Location
      - name: Sign and verify Windows artifacts
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ env.WINDOWS_SIGNING_GROUP == 'primary' && secrets.WINDOWS_CODESIGN_PFX_PASSWORD || env.WINDOWS_SIGNING_GROUP == 'secondary' && secrets.WINDOWS_SECONDARY_CODESIGN_PFX_PASSWORD || '' }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: | # zizmor: ignore[template-injection] Artifact names use the canonical SemVer validated by prepare.
          $ownedFiles = @(
            'artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-windows-arm64-portable.exe',
            'artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-windows-arm64.msi'
          )
          ./.github/scripts/sign-windows-artifacts.ps1 -Path $ownedFiles
      - name: Package Windows artifacts and signing metadata
        shell: pwsh
        run: | # zizmor: ignore[template-injection] Artifact names use the canonical SemVer validated by prepare.
          Compress-Archive `
            -Path 'flutter/build/windows/arm64/runner/Release/*' `
            -DestinationPath 'artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-windows-arm64.zip' `
            -Force
          $metadata = @(
            '.github/scripts/signing_metadata.py',
            'write',
            '--output', 'artifacts/native-signing-windows-arm64.json',
            '--artifact-directory', 'artifacts',
            '--platform', 'windows',
            '--architecture', 'arm64',
            '--native-signing', $env:WINDOWS_NATIVE_SIGNING,
            '--distribution-trust', $env:WINDOWS_DISTRIBUTION_TRUST,
            '--delivery', 'installable'
          )
          if ($env:WINDOWS_SIGNING_IDENTITY) {
            $metadata += @('--identity', $env:WINDOWS_SIGNING_IDENTITY)
          }
          python @metadata
      - name: Remove Windows signing material
        if: always()
        shell: pwsh
        run: |
          if ($env:WINDOWS_SIGNING_PFX_PATH) {
            Remove-Item -LiteralPath $env:WINDOWS_SIGNING_PFX_PATH -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: camellia-remote-${{ needs.prepare.outputs.version }}-windows-arm64-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  build_macos_universal:
    name: macOS universal
    needs: prepare
    if: ${{ needs.prepare.outputs.release_draft == 'true' }}
    runs-on: macos-26
    timeout-minutes: 90
    env:
      XCODE_VERSION: "26.2"
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
          submodules: recursive
      - name: Verify Xcode toolchain
        run: bash .github/scripts/verify-xcode.sh "$XCODE_VERSION"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare.outputs.bridge_artifact }}
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.ci_run_id }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # zizmor: ignore[superfluous-actions] The pinned action installs both exact macOS targets consistently.
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: ./.github/actions/setup-flutter
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - name: Resolve macOS signing mode
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ vars.APPLE_API_KEY || '' }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY || '' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_SIGNING_CERTIFICATE_SHA256 || '' }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_SECONDARY_API_ISSUER: ${{ vars.APPLE_SECONDARY_API_ISSUER || '' }}
          APPLE_SECONDARY_API_KEY: ${{ vars.APPLE_SECONDARY_API_KEY || '' }}
          APPLE_SECONDARY_API_PRIVATE_KEY: ${{ secrets.APPLE_SECONDARY_API_PRIVATE_KEY || '' }}
          APPLE_SECONDARY_CERTIFICATE: ${{ secrets.APPLE_SECONDARY_CERTIFICATE || '' }}
          APPLE_SECONDARY_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SECONDARY_CERTIFICATE_PASSWORD || '' }}
          APPLE_SECONDARY_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_SECONDARY_SIGNING_CERTIFICATE_SHA256 || '' }}
          APPLE_SECONDARY_SIGNING_IDENTITY: ${{ vars.APPLE_SECONDARY_SIGNING_IDENTITY || '' }}
        run: |
          SIGNING_ENV_FILE="$GITHUB_ENV" SIGNING_TEMP_DIRECTORY="$RUNNER_TEMP" \
            bash .github/scripts/resolve-macos-signing.sh
      - name: Import macOS signing identity
        if: env.MACOS_NATIVE_SIGNING == 'signed' || env.MACOS_NATIVE_SIGNING == 'notarized'
        shell: bash
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ env.MACOS_SIGNING_GROUP == 'primary' && secrets.APPLE_CERTIFICATE_PASSWORD || env.MACOS_SIGNING_GROUP == 'secondary' && secrets.APPLE_SECONDARY_CERTIFICATE_PASSWORD || '' }}
        run: |
          SIGNING_ENV_FILE="$GITHUB_ENV" SIGNING_TEMP_DIRECTORY="$RUNNER_TEMP" \
            bash .github/scripts/prepare-macos-signing.sh
      - name: Install macOS prerequisites
        run: bash .github/scripts/install-apple-prerequisites.sh
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          doNotCache: true
          vcpkgDirectory: ${{ runner.temp }}/vcpkg
      - name: Build
        shell: bash
        run: | # zizmor: ignore[template-injection] Release metadata is canonicalized by prepare and matrix values are fixed in this trusted workflow.
          bash .github/scripts/sync-version.sh \
            "${{ needs.prepare.outputs.version }}" \
            "${{ needs.prepare.outputs.build_number }}" \
            "${{ needs.prepare.outputs.source_date_epoch }}"
          bash .github/scripts/prepare-dependencies.sh "${{ env.DEPENDENCY_MODE }}"
          bash .github/scripts/verify-apple-pod-locks.sh macos
          "$VCPKG_ROOT/vcpkg" install --triplet arm64-osx --x-install-root="$VCPKG_ROOT/installed"
          cargo build --locked --release --target aarch64-apple-darwin --lib --features flutter,hwcodec,screencapturekit,unix-file-copy-paste
          "$VCPKG_ROOT/vcpkg" install --triplet x64-osx --x-install-root="$VCPKG_ROOT/installed"
          cargo build --locked --release --target x86_64-apple-darwin --lib --features flutter,hwcodec,screencapturekit,unix-file-copy-paste
          mkdir -p target/release
          lipo -create \
            target/aarch64-apple-darwin/release/libcamellia_remote.dylib \
            target/x86_64-apple-darwin/release/libcamellia_remote.dylib \
            -output target/release/libcamellia_remote.dylib
          (cd flutter && FLUTTER_XCODE_ARCHS="arm64 x86_64" flutter build macos --release)
      - name: Reject Apple build source migrations
        if: always()
        run: bash .github/scripts/verify-clean-source.sh
      - name: Stage and verify macOS artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          bash .github/scripts/stage-macos-release.sh \
            flutter/build/macos/Build/Products/Release \
            artifacts
      - name: Record macOS signing metadata
        shell: bash
        run: |
          metadata=(
            write
            --output artifacts/native-signing-macos-universal.json
            --artifact-directory artifacts
            --platform macos
            --architecture universal
            --native-signing "$MACOS_NATIVE_SIGNING"
            --distribution-trust "$MACOS_DISTRIBUTION_TRUST"
            --delivery installable
          )
          if [[ -n "${MACOS_SIGNING_IDENTITY:-}" ]]; then
            metadata+=(--identity "$MACOS_SIGNING_IDENTITY")
          fi
          python3 .github/scripts/signing_metadata.py "${metadata[@]}"
      - name: Remove macOS signing material
        if: always()
        shell: bash
        run: bash .github/scripts/cleanup-macos-signing.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: camellia-remote-${{ needs.prepare.outputs.version }}-macos-universal-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  build_linux:
    name: Linux ${{ matrix.arch }}
    needs: prepare
    if: ${{ needs.prepare.outputs.release_draft == 'true' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            vcpkg_triplet: x64-linux
            deb_arch: amd64
            appimage_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            vcpkg_triplet: arm64-linux
            deb_arch: arm64
            appimage_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare.outputs.bridge_artifact }}
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.ci_run_id }}
      - name: Resolve Linux artifact-signing mode
        shell: bash
        env:
          LINUX_GPG_FINGERPRINT: ${{ vars.LINUX_GPG_FINGERPRINT || '' }}
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY || '' }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE || '' }}
        run: SIGNING_ENV_FILE="$GITHUB_ENV" bash .github/scripts/resolve-linux-signing.sh
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl gcc g++ git libasound2-dev libclang-dev libdbus-1-dev libglib2.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev libaom-dev libopus-dev \
            libpam0g-dev libpulse-dev libva-dev libx11-dev libxi-dev libxtst-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxdo-dev libxfixes-dev libvpx-dev libyuv-dev gnupg nasm ninja-build pkg-config unzip wget
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # zizmor: ignore[superfluous-actions] The pinned action installs the fixed Linux matrix target consistently.
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: ./.github/actions/setup-flutter
        if: ${{ matrix.arch != 'arm64' }}
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - name: Install Flutter stable from source
        if: ${{ matrix.arch == 'arm64' }}
        shell: bash
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          revision="$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)"
          if [[ "$revision" != "$FLUTTER_REVISION" ]]; then
            echo "Unexpected Flutter revision: $revision" >&2
            exit 1
          fi
          echo "FLUTTER_ROOT=$RUNNER_TEMP/flutter" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Precache Flutter Linux
        if: ${{ matrix.arch == 'arm64' }}
        shell: bash
        run: flutter precache --linux
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          doNotCache: true
          vcpkgDirectory: ${{ runner.temp }}/vcpkg
      - name: Build
        shell: bash
        run: | # zizmor: ignore[template-injection] Prepare metadata is canonical and the Linux matrix is a fixed in-repository allowlist.
          bash .github/scripts/sync-version.sh \
            "${{ needs.prepare.outputs.version }}" \
            "${{ needs.prepare.outputs.build_number }}" \
            "${{ needs.prepare.outputs.source_date_epoch }}"
          bash .github/scripts/prepare-dependencies.sh "${{ env.DEPENDENCY_MODE }}"
          "$VCPKG_ROOT/vcpkg" install --triplet "${{ matrix.vcpkg_triplet }}" --x-install-root="$VCPKG_ROOT/installed"
          cargo build --locked --release --target "${{ matrix.target }}" --lib --features flutter,hwcodec,unix-file-copy-paste
          mkdir -p target/release
          cp "target/${{ matrix.target }}/release/libcamellia_remote.so" target/release/libcamellia_remote.so
          (cd flutter && flutter build linux --release)
          mkdir -p artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}
          cp -R flutter/build/linux/*/release/bundle/* artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}/
          tar -C artifacts -czf artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}.tar.gz camellia-remote-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}
          rm -rf artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}
          bash .github/scripts/package-linux.sh \
            "${{ needs.prepare.outputs.version }}" \
            "${{ matrix.arch }}" \
            "${{ matrix.deb_arch }}" \
            "${{ matrix.appimage_arch }}"
      - name: Sign and verify Linux artifacts
        if: ${{ env.ARTIFACT_SIGNING == 'openpgp-detached' }}
        shell: bash
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY || '' }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE || '' }}
        run: | # zizmor: ignore[template-injection] Artifact names use canonical SemVer and a fixed matrix architecture.
          name="camellia-remote-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}"
          public_key="artifacts/$name.signing-key.asc"
          artifacts=(
            "artifacts/$name.tar.gz"
            "artifacts/$name.deb"
            "artifacts/$name.AppImage"
          )
          LINUX_GPG_PUBLIC_KEY_OUTPUT="$public_key" \
            bash .github/scripts/linux-openpgp-sign.sh "${artifacts[@]}"
          LINUX_GPG_PUBLIC_KEY="$public_key" \
            bash .github/scripts/linux-openpgp-verify.sh "${artifacts[@]}"
      - name: Record Linux signing metadata
        shell: bash
        run: | # zizmor: ignore[template-injection] Signing metadata uses a fixed matrix architecture.
          metadata=(
            write
            --output "artifacts/native-signing-linux-${{ matrix.arch }}.json"
            --artifact-directory artifacts
            --platform linux
            --architecture "${{ matrix.arch }}"
            --native-signing not-applicable
            --distribution-trust not-applicable
            --artifact-signing "$ARTIFACT_SIGNING"
            --delivery installable
          )
          if [[ "$ARTIFACT_SIGNING" == openpgp-detached ]]; then
            metadata+=(--artifact-signing-identity "$LINUX_GPG_FINGERPRINT")
          fi
          python3 .github/scripts/signing_metadata.py "${metadata[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: camellia-remote-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/*.tar.gz
            artifacts/*.deb
            artifacts/*.AppImage
            artifacts/*.asc
            artifacts/native-signing-*.json
          if-no-files-found: error
          retention-days: 7

  build_android_arm64:
    name: Android arm64
    needs: prepare
    if: ${{ needs.prepare.outputs.release_draft == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # The Android toolchain, Flutter cache, vcpkg, and Rust artifacts exceed
      # the free space available on some runners unless unused preinstalls are removed.
      - name: Reclaim disk space for Android build
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare.outputs.bridge_artifact }}
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.ci_run_id }}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Resolve Android signing mode
        shell: bash
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY || '' }}
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD || '' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || '' }}
          ANDROID_ALIAS: ${{ secrets.ANDROID_ALIAS || '' }}
          ANDROID_SIGNING_CERTIFICATE_SHA256: ${{ vars.ANDROID_SIGNING_CERTIFICATE_SHA256 || '' }}
        run: |
          SIGNING_ENV_FILE="$GITHUB_ENV" SIGNING_TEMP_DIRECTORY="$RUNNER_TEMP" \
            bash .github/scripts/resolve-android-signing.sh
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # zizmor: ignore[superfluous-actions] The pinned action installs the exact Android target consistently.
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android
      - uses: ./.github/actions/setup-flutter
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          doNotCache: true
          vcpkgDirectory: ${{ runner.temp }}/vcpkg
      - name: Install host build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm ninja-build pkg-config
      - name: Install pinned NDK
        shell: bash
        run: |
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        env:
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD || '' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || '' }}
          CAMELLIA_FORMAL_RELEASE: "true"
        run: | # zizmor: ignore[template-injection] Prepare emits canonical numeric build metadata from the exact managed tag.
          bash .github/scripts/sync-version.sh \
            "${{ needs.prepare.outputs.version }}" \
            "${{ needs.prepare.outputs.build_number }}" \
            "${{ needs.prepare.outputs.source_date_epoch }}"
          bash .github/scripts/prepare-dependencies.sh "${{ env.DEPENDENCY_MODE }}"
          "$VCPKG_ROOT/vcpkg" install --triplet arm64-android --x-install-root="$VCPKG_ROOT/installed"
          android_api=26
          ndk_toolchain="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
          android_cc="$ndk_toolchain/bin/aarch64-linux-android${android_api}-clang"
          android_cxx="$ndk_toolchain/bin/aarch64-linux-android${android_api}-clang++"
          android_flags="--target=aarch64-linux-android${android_api} --sysroot=$ndk_toolchain/sysroot -D__ANDROID_API__=${android_api}"
          export CC_aarch64_linux_android="$android_cc"
          export CXX_aarch64_linux_android="$android_cxx"
          export AR_aarch64_linux_android="$ndk_toolchain/bin/llvm-ar"
          export RANLIB_aarch64_linux_android="$ndk_toolchain/bin/llvm-ranlib"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$android_cc"
          export CFLAGS_aarch64_linux_android="$android_flags"
          export CXXFLAGS_aarch64_linux_android="$android_flags"
          export BINDGEN_EXTRA_CLANG_ARGS="$android_flags -I$VCPKG_ROOT/installed/arm64-android/include"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="$BINDGEN_EXTRA_CLANG_ARGS"
          # mediacodec (Android hardware decode) is intentionally absent: the
          # module in libs/scrap has drifted from the current ImageRgb/CodecFormat
          # APIs and does not compile. Re-add it together with the fixes, verified
          # against a real Android NDK toolchain.
          cargo build --locked --release --target aarch64-linux-android --lib --no-default-features --features use_dasp,flutter,hwcodec
          mkdir -p flutter/android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libcamellia_remote.so flutter/android/app/src/main/jniLibs/arm64-v8a/camellia_remote.so
          (cd flutter && flutter build apk --release --target-platform android-arm64)
          (cd flutter && flutter build appbundle --release --target-platform android-arm64)
          mkdir -p artifacts
          mapfile -t apk_candidates < <(
            find flutter/build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*release*.apk'
          )
          mapfile -t aab_candidates < <(
            find flutter/build/app/outputs/bundle/release -maxdepth 1 -type f -name '*.aab'
          )
          [[ "${#apk_candidates[@]}" == 1 && "${#aab_candidates[@]}" == 1 ]] || {
            echo "Expected exactly one release APK and AAB" >&2
            exit 1
          }
          apk="${apk_candidates[0]}"
          aab="${aab_candidates[0]}"
          apk_output="artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-android-arm64${ANDROID_ARTIFACT_SUFFIX}.apk"
          aab_output="artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-android-arm64${ANDROID_ARTIFACT_SUFFIX}.aab"
          cp "$apk" "$apk_output"
          cp "$aab" "$aab_output"

          build_tools="$(
            find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -print |
              sort -V |
              tail -n 1
          )"
          apksigner="$build_tools/apksigner"
          [[ -x "$apksigner" ]] || {
            echo "apksigner was not found in the installed Android build tools" >&2
            exit 1
          }
          if [[ "$ANDROID_NATIVE_SIGNING" == signed ]]; then
            certificate_sha256="$(
              "$apksigner" verify --verbose --print-certs "$apk_output" |
                sed -n 's/^Signer #1 certificate SHA-256 digest: //p' |
                tr '[:lower:]' '[:upper:]'
            )"
            [[ "$certificate_sha256" == "$ANDROID_SIGNING_IDENTITY" ]] || {
              echo "Android APK signer does not match the resolved keystore identity" >&2
              exit 1
            }
            aab_verification="$(
              jarsigner -J-Duser.language=en -verify -verbose -certs "$aab_output" 2>&1
            )"
            grep -F 'jar verified.' <<< "$aab_verification" >/dev/null || {
              echo "Android AAB signature verification failed" >&2
              exit 1
            }
          else
            if "$apksigner" verify "$apk_output" >/dev/null 2>&1; then
              echo "Android unsigned APK unexpectedly contains a valid signature" >&2
              exit 1
            fi
            aab_verification="$(
              jarsigner -J-Duser.language=en -verify -verbose -certs "$aab_output" 2>&1
            )"
            if grep -F 'jar verified.' <<< "$aab_verification" >/dev/null; then
              echo "Android unsigned AAB unexpectedly contains a verified signature" >&2
              exit 1
            fi
            if ! grep -F 'jar is unsigned.' <<< "$aab_verification" >/dev/null; then
              echo "Android unsigned AAB did not report the expected unsigned state" >&2
              exit 1
            fi
          fi
      - name: Record Android signing metadata
        shell: bash
        run: |
          trust=none
          delivery=re-signing-input
          metadata=(
            write
            --output artifacts/native-signing-android-arm64.json
            --artifact-directory artifacts
            --platform android
            --architecture arm64
            --native-signing "$ANDROID_NATIVE_SIGNING"
            --distribution-trust none
            --delivery "$delivery"
          )
          if [[ "$ANDROID_NATIVE_SIGNING" == signed ]]; then
            trust=platform-key
            delivery=installable
            metadata=(
              write
              --output artifacts/native-signing-android-arm64.json
              --artifact-directory artifacts
              --platform android
              --architecture arm64
              --native-signing signed
              --distribution-trust "$trust"
              --identity "$ANDROID_SIGNING_IDENTITY"
              --delivery "$delivery"
            )
          fi
          python3 .github/scripts/signing_metadata.py "${metadata[@]}"
      - name: Remove Android signing material
        if: always()
        shell: bash
        run: rm -f -- "${CAMELLIA_ANDROID_STORE_FILE:-}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: camellia-remote-${{ needs.prepare.outputs.version }}-android-arm64-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  build_ios:
    name: iOS
    needs: prepare
    if: ${{ needs.prepare.outputs.release_draft == 'true' }}
    runs-on: macos-26
    timeout-minutes: 90
    env:
      XCODE_VERSION: "26.2"
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      IPHONEOS_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
          submodules: recursive
      - name: Verify Xcode toolchain
        run: bash .github/scripts/verify-xcode.sh "$XCODE_VERSION"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare.outputs.bridge_artifact }}
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.ci_run_id }}
      - name: Resolve iOS signing mode
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 || '' }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD || '' }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 || '' }}
          IOS_SIGNING_CERTIFICATE_SHA256: ${{ vars.IOS_SIGNING_CERTIFICATE_SHA256 || '' }}
          IOS_SIGNING_IDENTITY: ${{ vars.IOS_SIGNING_IDENTITY || '' }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID || '' }}
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || '' }}
        run: |
          SIGNING_ENV_FILE="$GITHUB_ENV" SIGNING_TEMP_DIRECTORY="$RUNNER_TEMP" \
            bash .github/scripts/resolve-ios-signing.sh
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # zizmor: ignore[superfluous-actions] The pinned action installs the exact iOS target consistently.
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-ios
      - uses: ./.github/actions/setup-flutter
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - name: Install iOS prerequisites
        run: bash .github/scripts/install-apple-prerequisites.sh
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          doNotCache: true
          vcpkgDirectory: ${{ runner.temp }}/vcpkg
      - name: Prepare iOS signing identity and profile
        if: env.IOS_NATIVE_SIGNING == 'signed'
        shell: bash
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD || '' }}
          IOS_SIGNING_CERTIFICATE_SHA256: ${{ vars.IOS_SIGNING_CERTIFICATE_SHA256 || '' }}
          IOS_SIGNING_IDENTITY: ${{ vars.IOS_SIGNING_IDENTITY || '' }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID || '' }}
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || '' }}
          IOS_SIGNING_XCCONFIG_PATH: ${{ github.workspace }}/flutter/ios/Flutter/Signing.xcconfig
        run: |
          SIGNING_ENV_FILE="$GITHUB_ENV" SIGNING_TEMP_DIRECTORY="$RUNNER_TEMP" \
            bash .github/scripts/prepare-ios-signing.sh
      - name: Build
        shell: bash
        env:
          IOS_SIGNING_IDENTITY: ${{ vars.IOS_SIGNING_IDENTITY || '' }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID || '' }}
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || '' }}
        run: | # zizmor: ignore[template-injection] Prepare emits canonical numeric build metadata from the exact managed tag.
          bash .github/scripts/sync-version.sh \
            "${{ needs.prepare.outputs.version }}" \
            "${{ needs.prepare.outputs.build_number }}" \
            "${{ needs.prepare.outputs.source_date_epoch }}"
          bash .github/scripts/prepare-dependencies.sh "${{ env.DEPENDENCY_MODE }}"
          bash .github/scripts/verify-apple-pod-locks.sh ios
          "$VCPKG_ROOT/vcpkg" install --triplet arm64-ios --x-install-root="$VCPKG_ROOT/installed"
          cargo build --locked --release --target aarch64-apple-ios --lib --features flutter
          bash .github/scripts/build-ios-release.sh
      - name: Reject Apple build source migrations
        if: always()
        run: bash .github/scripts/verify-clean-source.sh
      - name: Stage and verify iOS artifacts
        shell: bash
        run: >- # zizmor: ignore[template-injection] The stage name uses canonical SemVer validated by prepare.
          bash .github/scripts/stage-ios-release.sh
          "${{ needs.prepare.outputs.version }}"
      - name: Record iOS signing metadata
        shell: bash
        run: |
          metadata=(
            write
            --output artifacts/native-signing-ios-arm64.json
            --artifact-directory artifacts
            --platform ios
            --architecture arm64
            --native-signing "$IOS_NATIVE_SIGNING"
            --distribution-trust "$IOS_DISTRIBUTION_TRUST"
          )
          if [[ "$IOS_NATIVE_SIGNING" == signed ]]; then
            metadata+=(
              --identity "$IOS_SIGNING_IDENTITY_SHA256"
              --delivery installable
            )
          else
            metadata+=(--delivery re-signing-input)
          fi
          python3 .github/scripts/signing_metadata.py "${metadata[@]}"
      - name: Remove iOS signing material
        if: always()
        shell: bash
        run: bash .github/scripts/cleanup-ios-signing.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: camellia-remote-${{ needs.prepare.outputs.version }}-ios-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  build_web:
    name: Web
    needs: prepare
    if: ${{ needs.prepare.outputs.release_draft == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
          submodules: recursive
      - uses: ./.github/actions/setup-flutter
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Build
        shell: bash
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
        run: |
          chmod +x flutter/web/tools/build_web.sh
          ./flutter/web/tools/build_web.sh --mode release
          mkdir -p artifacts
          tar -C flutter/build -czf "artifacts/camellia-remote-${RELEASE_VERSION}-web.tar.gz" web
          (cd flutter/build && zip -qry "$GITHUB_WORKSPACE/artifacts/camellia-remote-${RELEASE_VERSION}-web.zip" web)
      - name: Record Web artifact metadata
        shell: bash
        run: |
          python3 .github/scripts/signing_metadata.py write \
            --output artifacts/native-signing-web-universal.json \
            --artifact-directory artifacts \
            --platform web \
            --architecture universal \
            --native-signing not-applicable \
            --distribution-trust not-applicable \
            --delivery deployment-artifact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: camellia-remote-${{ needs.prepare.outputs.version }}-web-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  finalize_candidate:
    name: Candidate evidence
    needs:
      - prepare
      - build_windows_x64
      - build_windows_arm64
      - build_macos_universal
      - build_linux
      - build_android_arm64
      - build_ios
      - build_web
    if: >-
      always() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.release_draft == 'true' &&
      needs.build_windows_x64.result == 'success' &&
      needs.build_windows_arm64.result == 'success' &&
      needs.build_macos_universal.result == 'success' &&
      needs.build_linux.result == 'success' &&
      needs.build_android_arm64.result == 'success' &&
      needs.build_ios.result == 'success' &&
      needs.build_web.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read # Download only exact-attempt platform artifacts and CI evidence.
      attestations: write # Record provenance for the frozen cross-platform inventory.
      contents: read
      id-token: write # Mint the short-lived identity used by GitHub attestations.
    steps:
      - name: Checkout immutable candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
          submodules: recursive

      - name: Download exact-attempt platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: camellia-remote-${{ needs.prepare.outputs.version }}-*-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-inputs

      - name: Assemble exact candidate inventory
        shell: bash
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          CI_RUN_ID: ${{ needs.prepare.outputs.ci_run_id }}
          PROTOCOL_COMMIT: ${{ needs.prepare.outputs.camellia_remote_protocol }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
        run: |
          args=(
            assemble
            --input-directory "$RUNNER_TEMP/release-inputs"
            --output-directory "$RUNNER_TEMP/release-assets"
            --version "$RELEASE_VERSION"
            --app-version "$APP_VERSION"
            --build-number "$BUILD_NUMBER"
            --tag "$RELEASE_TAG"
            --source-commit "$RELEASE_COMMIT"
            --protocol-commit "$PROTOCOL_COMMIT"
            --verified-ci-run-id "$CI_RUN_ID"
            --source-date-epoch "$SOURCE_DATE_EPOCH"
            --candidate-run-id "$GITHUB_RUN_ID"
            --candidate-run-attempt "$GITHUB_RUN_ATTEMPT"
            --repository "$GITHUB_REPOSITORY"
            --workflow-ref "$GITHUB_WORKFLOW_REF"
            --publication-requested true
            --rust-toolchain "$RUST_TOOLCHAIN"
            --flutter-version "$FLUTTER_VERSION"
            --flutter-revision "$FLUTTER_REVISION"
            --node-version "$NODE_VERSION"
            --android-ndk-version "$ANDROID_NDK_VERSION"
          )
          args+=(
            --selected-platform android-arm64
            --selected-platform ios
            --selected-platform linux-arm64
            --selected-platform linux-x64
            --selected-platform macos-universal
            --selected-platform web
            --selected-platform windows-arm64
            --selected-platform windows-x64
          )
          python3 .github/scripts/candidate_evidence.py "${args[@]}"

      - name: Aggregate native signing evidence
        shell: bash
        run: |
          python3 .github/scripts/signing_metadata.py aggregate \
            --asset-directory "$RUNNER_TEMP/release-assets" \
            --manifest "$RUNNER_TEMP/release-assets/versions.json" \
            --report "$RUNNER_TEMP/release-assets/NATIVE-SIGNING.md"

      - name: Generate pinned SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          artifact-name: camellia-remote-${{ needs.prepare.outputs.version }}.spdx.json
          format: spdx-json
          output-file: ${{ runner.temp }}/release-assets/camellia-remote-${{ needs.prepare.outputs.version }}.spdx.json
          path: .
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false

      - name: Generate attestation subject inventory
        run: >-
          python3 .github/scripts/candidate_evidence.py checksums
          --asset-directory "$RUNNER_TEMP/release-assets"

      - name: Attest exact candidate inventory
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          create-storage-record: false
          subject-checksums: ${{ runner.temp }}/release-assets/SHA256SUMS

      - name: Cryptographically verify provenance bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/publish-release.yml
        run: |
          [[ -f "$PROVENANCE_BUNDLE" ]] || {
            echo "attestation action did not produce a provenance bundle" >&2
            exit 1
          }
          while IFS= read -r checksum; do
            name="${checksum#*  }"
            gh attestation verify "$RUNNER_TEMP/release-assets/$name" \
              --bundle "$PROVENANCE_BUNDLE" \
              --deny-self-hosted-runners \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$SIGNER_WORKFLOW" >/dev/null
          done < "$RUNNER_TEMP/release-assets/SHA256SUMS"

      - name: Preserve provenance bundle
        shell: bash
        env:
          PROVENANCE_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          [[ -f "$PROVENANCE_BUNDLE" ]] || {
            echo "attestation action did not produce a provenance bundle" >&2
            exit 1
          }
          cp -- "$PROVENANCE_BUNDLE" \
            "$RUNNER_TEMP/release-assets/camellia-remote-${RELEASE_VERSION}.provenance.intoto.jsonl"
      - name: Build organization release evidence
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          VALIDATION_RUN_ID: ${{ needs.prepare.outputs.ci_run_id }}
        run: |
          python3 .github/scripts/build-client-release-evidence.py \
            --asset-directory "$RUNNER_TEMP/release-assets" \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT" \
            --validation-run-id "$VALIDATION_RUN_ID" \
            --output "$RUNNER_TEMP/release-assets/release-evidence.json"
          python3 .github/scripts/validate-release-evidence.py \
            "$RUNNER_TEMP/release-assets/release-evidence.json"
      - name: Finalize checksum inventory
        run: |
          python3 .github/scripts/candidate_evidence.py checksums \
            --asset-directory "$RUNNER_TEMP/release-assets"

      - name: Verify final candidate evidence
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 .github/scripts/candidate_evidence.py verify \
            --asset-directory "$RUNNER_TEMP/release-assets" \
            --version "$RELEASE_VERSION" \
            --source-commit "$RELEASE_COMMIT"

      - name: Upload consolidated candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-assets-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.commit }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Summarize candidate evidence
        shell: bash
        env:
          CANDIDATE_ARTIFACT: candidate-assets-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.commit }}-run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          {
            echo "### Consolidated candidate evidence"
            echo
            echo "- Artifact: \`$CANDIDATE_ARTIFACT\`"
            echo "- Retention: 7 days"
            echo "- SPDX generator: \`syft v1.50.0\`"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/release-assets/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish
    needs: [prepare, finalize_candidate]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (
        needs.prepare.outputs.release_draft == 'false' ||
        needs.finalize_candidate.result == 'success'
      )
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 30
    permissions:
      actions: read # Download only the exact frozen release candidate.
      contents: read
      id-token: write # Mint the short-lived keyless Sigstore publication identity.
    steps:
      - name: Release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: write
          permission-issues: write
          permission-metadata: read
          permission-pull-requests: read
      - name: Checkout immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Trusted publication control
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            candidate_evidence.py \
            manage-release.py \
            publish-client-release.sh \
            validate-release-evidence.py
          do
            git show "$GITHUB_WORKFLOW_SHA:.github/scripts/$script" \
              > "$RUNNER_TEMP/$script"
            chmod 700 "$RUNNER_TEMP/$script"
          done
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Reauthorize
        id: release
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_SHA: ${{ needs.prepare.outputs.commit }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 "$RUNNER_TEMP/manage-release.py" authorize \
            --version "$VERSION" \
            --sha "$RELEASE_SHA" \
            --tag "$RELEASE_TAG"
      - name: Download consolidated candidate evidence
        if: ${{ needs.prepare.outputs.release_draft == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-assets-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.commit }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets
      - name: Reverify candidate before publication
        if: ${{ needs.prepare.outputs.release_draft == 'true' }}
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 "$RUNNER_TEMP/candidate_evidence.py" verify \
            --asset-directory release-assets \
            --version "$RELEASE_VERSION" \
            --source-commit "$RELEASE_COMMIT"
      - name: Validate organization evidence
        if: ${{ needs.prepare.outputs.release_draft == 'true' }}
        run: >-
          python3 "$RUNNER_TEMP/validate-release-evidence.py"
          release-assets/release-evidence.json
      - name: Publish or verify exact release
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_ASSET_DIRECTORY: ${{ github.workspace }}/release-assets
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_ID: ${{ steps.release.outputs.release-id }}
          RELEASE_PR_NUMBER: ${{ steps.release.outputs.release-pr-number }}
          RELEASE_SIGNING_IDENTITY: ${{ needs.prepare.outputs.signing_identity }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_TITLE: Camellia Remote Client
          VERIFY_PUBLISHED_ONLY: ${{ needs.prepare.outputs.release_draft == 'false' }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash "$RUNNER_TEMP/publish-client-release.sh"
      - name: Complete publication
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_SHA: ${{ needs.prepare.outputs.commit }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 "$RUNNER_TEMP/manage-release.py" complete \
            --version "$VERSION" \
            --sha "$RELEASE_SHA" \
            --tag "$RELEASE_TAG"
      - name: Reconcile highest completed stable release
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_SHA: ${{ needs.prepare.outputs.commit }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 "$RUNNER_TEMP/manage-release.py" reconcile-latest \
            --version "$VERSION" \
            --sha "$RELEASE_SHA" \
            --tag "$RELEASE_TAG"

  propose_management_lock:
    name: Propose Management Web lock
    needs: [prepare, publish]
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Resolve reviewed repository map
        id: repositories
        env:
          REMOTE_REPOSITORY_MAP: ${{ vars.REMOTE_REPOSITORY_MAP }}
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            type == "object" and
            keys == [
              "remote-client",
              "remote-management",
              "remote-protocol",
              "remote-server"
            ] and
            all(.[];
              type == "string" and
              length >= 1 and length <= 100 and
              test("^[A-Za-z0-9._-]+$")
            )
          ' <<< "$REMOTE_REPOSITORY_MAP" >/dev/null
          current="$(jq -r '."remote-client"' <<< "$REMOTE_REPOSITORY_MAP")"
          management="$(jq -r '."remote-management"' <<< "$REMOTE_REPOSITORY_MAP")"
          current_repository="${GITHUB_REPOSITORY#*/}"
          [[ "${current,,}" == "${current_repository,,}" ]]
          [[ "${management,,}" != "${current,,}" ]]
          echo "management=$management" >> "$GITHUB_OUTPUT"
      - name: Cross-repository App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            ${{ steps.repositories.outputs.management }}
          permission-contents: write
          permission-metadata: read
          permission-pull-requests: write
      - name: Trusted lock proposal control
        shell: bash
        run: |
          git show \
            "$GITHUB_WORKFLOW_SHA:.github/scripts/propose-management-web-lock.py" \
            > "$RUNNER_TEMP/propose-management-web-lock.py"
          chmod 700 "$RUNNER_TEMP/propose-management-web-lock.py"
      - name: Open or verify lock update PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          REMOTE_REPOSITORY_MAP: ${{ vars.REMOTE_REPOSITORY_MAP }}
        run: |
          python3 "$RUNNER_TEMP/propose-management-web-lock.py" \
            --repository-map "$REMOTE_REPOSITORY_MAP" \
            --current-repository "$GITHUB_REPOSITORY" \
            --release-app-login "$RELEASE_APP_LOGIN" \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT"
