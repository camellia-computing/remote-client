name: Performance

on:
  schedule:
    - cron: "19 4 * * 3"
  workflow_dispatch:
    inputs:
      tier:
        description: Evidence tier
        required: true
        default: scheduled
        type: choice
        options:
          - scheduled
          - release
      control_revision:
        description: Exact 40-character control SHA; required for release
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: remote-client-performance-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  compare:
    name: ${{ github.event_name == 'schedule' && 'Scheduled' || inputs.tier }} A/B
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          path: candidate
          persist-credentials: false
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Resolve immutable A/B inputs
        id: inputs
        working-directory: candidate
        shell: bash
        env:
          CANDIDATE_REVISION: ${{ github.sha }}
          CONTROL_INPUT: ${{ inputs.control_revision }}
          EVENT_NAME: ${{ github.event_name }}
          TIER_INPUT: ${{ inputs.tier }}
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          [[ "$candidate" == "$CANDIDATE_REVISION" && "$candidate" =~ ^[0-9a-f]{40}$ ]]
          tier="${TIER_INPUT:-scheduled}"
          [[ "$tier" == scheduled || "$tier" == release ]]
          if [[ -n "$CONTROL_INPUT" ]]; then
            [[ "$CONTROL_INPUT" =~ ^[0-9a-f]{40}$ ]]
            control="$CONTROL_INPUT"
          else
            [[ "$tier" == scheduled ]]
            control="$(git rev-parse HEAD^)"
          fi
          [[ "$control" != "$candidate" ]]
          if [[ "$tier" == release ]]; then
            iterations=5
            warmups=0
            work_seconds=60
            timeout_seconds=90
          else
            iterations=15
            warmups=1
            work_seconds=5
            timeout_seconds=30
          fi
          {
            echo "candidate=$candidate"
            echo "control=$control"
            echo "iterations=$iterations"
            echo "policy=performance/client-vp9-quality-v1.$tier.json"
            echo "tier=$tier"
            echo "timeout_seconds=$timeout_seconds"
            echo "warmups=$warmups"
            echo "work_seconds=$work_seconds"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false
          ref: ${{ steps.inputs.outputs.control }}
          submodules: recursive

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # zizmor: ignore[superfluous-actions]
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install bounded software-codec prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake gcc g++ libclang-dev libvpx-dev pkg-config

      - name: Validate shared performance contract
        run: python3 -m unittest -v tools.test_performance_contract
        working-directory: candidate/libs/camellia_remote_protocol

      - name: Build and compare bounded VP9 observations
        env:
          CAMELLIA_PERFORMANCE_WORK_SECONDS: ${{ steps.inputs.outputs.work_seconds }}
          CANDIDATE_REVISION: ${{ steps.inputs.outputs.candidate }}
          CONTROL_REVISION: ${{ steps.inputs.outputs.control }}
          ITERATIONS: ${{ steps.inputs.outputs.iterations }}
          POLICY: ${{ steps.inputs.outputs.policy }}
          TIER: ${{ steps.inputs.outputs.tier }}
          TIMEOUT_SECONDS: ${{ steps.inputs.outputs.timeout_seconds }}
          WARMUPS: ${{ steps.inputs.outputs.warmups }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 \
            candidate/libs/scrap/src/common/quality_harness.rs \
            control/libs/scrap/src/common/quality_harness.rs
          build_harness() {
            local repository="$1"
            local output="$2"
            local manifest="$RUNNER_TEMP/${repository}-scrap-artifacts.jsonl"
            CARGO_TARGET_DIR="$RUNNER_TEMP/client-performance-target" \
              cargo test --locked --release --no-run --message-format=json \
              --manifest-path "$repository/Cargo.toml" \
              --package scrap --features linux-pkg-config > "$manifest"
            python3 - "$manifest" "$output" <<'PY'
          import json
          import os
          import pathlib
          import shutil
          import sys

          manifest, output = map(pathlib.Path, sys.argv[1:])
          executables = set()
          for line in manifest.read_text(encoding="utf-8").splitlines():
              record = json.loads(line)
              if (
                  record.get("reason") == "compiler-artifact"
                  and record.get("target", {}).get("name") == "scrap"
                  and record.get("profile", {}).get("test") is True
                  and record.get("executable")
              ):
                  executables.add(pathlib.Path(record["executable"]))
          if len(executables) != 1:
              raise SystemExit(f"expected one scrap test executable, got {sorted(map(str, executables))}")
          shutil.copyfile(executables.pop(), output)
          os.chmod(output, 0o755)
          PY
          }
          build_harness control "$RUNNER_TEMP/client-control-harness"
          build_harness candidate "$RUNNER_TEMP/client-candidate-harness"
          libvpx_version="$(pkg-config --modversion vpx)"
          [[ "$libvpx_version" =~ ^[0-9]+([.][0-9]+){1,3}$ ]]
          python3 candidate/libs/camellia_remote_protocol/tools/performance_contract.py collect-pair \
            --repository remote-client \
            --control-revision "$CONTROL_REVISION" \
            --candidate-revision "$CANDIDATE_REVISION" \
            --scenario client-vp9-quality-v1 \
            --tier "$TIER" \
            --runner-class github-ubuntu-24.04-x64 \
            --toolchain "rust-1.97.1-libvpx-$libvpx_version" \
            --iterations "$ITERATIONS" --warmups "$WARMUPS" \
            --timeout-seconds "$TIMEOUT_SECONDS" \
            --control-output "$RUNNER_TEMP/client-control-performance.json" \
            --candidate-output "$RUNNER_TEMP/client-candidate-performance.json" \
            -- "$RUNNER_TEMP/client-control-harness" \
            common::quality_harness::performance_contract_observation --ignored --exact \
            ::: "$RUNNER_TEMP/client-candidate-harness" \
            common::quality_harness::performance_contract_observation --ignored --exact
          python3 candidate/libs/camellia_remote_protocol/tools/performance_contract.py compare \
            "$RUNNER_TEMP/client-control-performance.json" \
            "$RUNNER_TEMP/client-candidate-performance.json" \
            "candidate/$POLICY" \
            --output "$RUNNER_TEMP/client-performance-comparison.json"

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-${{ steps.inputs.outputs.tier }}-${{ steps.inputs.outputs.candidate }}
          path: |
            ${{ runner.temp }}/client-control-performance.json
            ${{ runner.temp }}/client-candidate-performance.json
            ${{ runner.temp }}/client-performance-comparison.json
          if-no-files-found: error
          retention-days: 30
