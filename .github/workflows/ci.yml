name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.93.0"
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: "3.44.5"
  NODE_VERSION: "24.18.0"
  DEPENDENCY_MODE: locked

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.changes.outputs.runtime }}
      automation: ${{ steps.changes.outputs.automation }}
      dependencies: ${{ steps.changes.outputs.dependencies }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          runtime=false
          automation=false
          dependencies=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            runtime=true
            automation=true
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
            else
              base="$PUSH_BASE_SHA"
              head="$PUSH_HEAD_SHA"
            fi
            if [[ "$base" =~ ^0+$ ]]; then
              base="$(git hash-object -t tree /dev/null)"
            fi

            changed_paths="$RUNNER_TEMP/client-changed-paths"
            git diff --name-only -z "$base" "$head" > "$changed_paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                README.md|README_*.md|docs/*|LICENSE|LICENSE.*|CONTRIBUTING.md|CODE_OF_CONDUCT.md|.github/ISSUE_TEMPLATE/*|.github/workflows/*|.github/dependabot.yml|.github/scripts/release_metadata.py|.github/scripts/tests/test_release_metadata.py)
                  ;;
                *)
                  runtime=true
                  ;;
              esac
              case "$path" in
                .github/*|build.py|flutter/web/tools/build_web.sh)
                  automation=true
                  ;;
              esac
              case "$path" in
                Cargo.toml|Cargo.lock|*/Cargo.toml|*/Cargo.lock|flutter/pubspec.yaml|flutter/pubspec.lock|flutter/web/js/package.json|flutter/web/js/package-lock.json|vcpkg.json|vcpkg-configuration.json|.gitmodules|libs/camellia_remote_protocol|.github/dependabot.yml|.github/workflows/*)
                  dependencies=true
                  ;;
              esac
            done < "$changed_paths"
          fi

          {
            echo "runtime=$runtime"
            echo "automation=$automation"
            echo "dependencies=$dependencies"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Change classification"
            echo
            echo "- Runtime validation: \`$runtime\`"
            echo "- Automation validation: \`$automation\`"
            echo "- Dependency review: \`$dependencies\`"
          } >> "$GITHUB_STEP_SUMMARY"

  metadata:
    name: Validate component version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      app_version: ${{ steps.release.outputs.app_version }}
      build_number: ${{ steps.release.outputs.build_number }}
      tag: ${{ steps.release.outputs.tag }}
      source_date_epoch: ${{ steps.source.outputs.source_date_epoch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test and validate release metadata
        id: release
        run: |
          python3 .github/scripts/tests/test_release_metadata.py
          python3 .github/scripts/release_metadata.py --github-output

      - name: Resolve reproducible source timestamp
        id: source
        shell: bash
        run: echo "source_date_epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

  dependency_review:
    name: Review dependency changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.classify.outputs.dependencies == 'true'
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency graph delta
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

  automation:
    name: Workflow and build automation
    if: needs.classify.outputs.automation == 'true'
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflows and shell scripts
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          shellcheck \
            .github/actions/setup-flutter/*.sh \
            .github/scripts/*.sh \
            .github/scripts/tests/*.sh \
            flutter/web/tools/build_web.sh

      - name: Install Java for Android signing tests
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Test build automation
        run: |
          python3 -m compileall -q .github/scripts libs/portable
          python3 -m unittest discover -s .github/scripts/tests -v
          python3 -m unittest discover -s libs/portable/tests -v
          bash .github/scripts/tests/test_dependency_lock_scope.sh
          bash .github/scripts/tests/test_flutter_archive_verification.sh
          bash .github/scripts/tests/test_release_publication.sh
          bash .github/scripts/tests/test_release_signing.sh
          pwsh -NoProfile -File .github/scripts/tests/test_windows_signing_resolver.ps1

  windows_automation:
    name: Windows build automation
    if: needs.classify.outputs.automation == 'true'
    needs: classify
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Flutter archive verification under Git for Windows
        shell: bash
        run: bash .github/scripts/tests/test_flutter_archive_verification.sh

  generate_bridge:
    name: Generate Flutter Rust bridge
    if: needs.classify.outputs.runtime == 'true'
    needs: [classify, metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Install Flutter
        uses: ./.github/actions/setup-flutter
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl gcc g++ git libasound2-dev libclang-dev libdbus-1-dev libglib2.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev libaom-dev libopus-dev \
            libpam0g-dev libpulse-dev libva-dev libx11-dev libxi-dev libxtst-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxdo-dev libxfixes-dev libvpx-dev libyuv-dev nasm ninja-build pkg-config unzip wget

      - name: Synchronize declared version
        run: |
          bash .github/scripts/sync-version.sh \
            "${{ needs.metadata.outputs.version }}" \
            "${{ needs.metadata.outputs.build_number }}" \
            "${{ needs.metadata.outputs.source_date_epoch }}"

      - name: Prepare locked dependencies
        run: bash .github/scripts/prepare-dependencies.sh "${{ env.DEPENDENCY_MODE }}"

      - name: Generate bridge
        run: bash .github/scripts/generate-bridge.sh

      - name: Format generated Rust bridge
        run: cargo fmt --all

      - name: Upload generated bridge
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-generated-${{ github.sha }}
          path: |
            src/bridge_generated*.rs
            flutter/lib/generated_bridge*.dart
            flutter/lib/generated_bridge/**
            flutter/macos/Runner/bridge_generated.h
            flutter/ios/Runner/bridge_generated.h
          if-no-files-found: error
          retention-days: 14

  windows_rust:
    name: Windows Rust smoke check (${{ matrix.target }})
    if: needs.classify.outputs.runtime == 'true'
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Check Windows input implementation
        run: >-
          cargo check --locked -p enigo
          --target ${{ matrix.target }}
          --features with_serde

  windows_portable:
    name: Windows portable smoke check (${{ matrix.target }})
    if: needs.classify.outputs.runtime == 'true'
    needs: classify
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Build deterministic portable launcher fixture
        shell: pwsh
        run: |
          $payload = Join-Path $env:RUNNER_TEMP 'camellia-portable-smoke-payload'
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          [System.IO.File]::WriteAllBytes(
            (Join-Path $payload 'camellia-remote.exe'),
            [byte[]](0x4d, 0x5a)
          )
          python -m pip install --disable-pip-version-check -r libs/portable/requirements.txt
          python libs/portable/generate.py `
            --folder $payload `
            --output libs/portable `
            --executable camellia-remote.exe `
            --target '${{ matrix.target }}'

  quality:
    name: Rust, Flutter, and Web quality
    if: needs.classify.outputs.runtime == 'true'
    needs: [classify, metadata, generate_bridge]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Download generated bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-generated-${{ github.sha }}
          path: .

      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl gcc g++ git libasound2-dev libclang-dev libdbus-1-dev libglib2.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev libaom-dev libopus-dev \
            libpam0g-dev libpulse-dev libva-dev libx11-dev libxi-dev libxtst-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxdo-dev libxfixes-dev libvpx-dev libyuv-dev nasm ninja-build pkg-config unzip wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt,clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Install Flutter
        uses: ./.github/actions/setup-flutter
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: flutter/web/js/package-lock.json

      - name: Verify generated brand assets
        run: bash .github/scripts/verify-brand-assets.sh

      - name: Synchronize declared version
        run: |
          bash .github/scripts/sync-version.sh \
            "${{ needs.metadata.outputs.version }}" \
            "${{ needs.metadata.outputs.build_number }}" \
            "${{ needs.metadata.outputs.source_date_epoch }}"

      - name: Prepare locked dependencies
        run: bash .github/scripts/prepare-dependencies.sh "${{ env.DEPENDENCY_MODE }}"

      - name: Bootstrap verified Web codec assets
        run: bash flutter/web/tools/prepare_web_deps.sh

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Install pinned Rust dependency auditor
        run: cargo install cargo-audit --version 0.22.2 --locked --no-default-features

      - name: Rust dependency audit
        run: python3 .github/scripts/audit_cargo_dependencies.py

      - name: Rust clippy
        run: cargo clippy --locked --workspace --all-targets --features flutter

      - name: Rust tests
        run: cargo test --locked --workspace --features flutter

      - name: Flutter analyze
        working-directory: flutter
        run: flutter analyze --no-fatal-infos

      - name: Flutter tests
        working-directory: flutter
        run: flutter test

      - name: Web bridge lint
        working-directory: flutter/web/js
        run: npm run lint

      - name: Web bridge build
        working-directory: flutter/web/js
        run: npm run build

      - name: Web dependency audit
        working-directory: flutter/web/js
        run: npm audit --audit-level=high

  required:
    name: CI / Required
    if: always()
    needs:
      - classify
      - metadata
      - dependency_review
      - automation
      - windows_automation
      - generate_bridge
      - windows_rust
      - windows_portable
      - quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce required results
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUNTIME_REQUIRED: ${{ needs.classify.outputs.runtime }}
          AUTOMATION_REQUIRED: ${{ needs.classify.outputs.automation }}
          DEPENDENCIES_CHANGED: ${{ needs.classify.outputs.dependencies }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          METADATA_RESULT: ${{ needs.metadata.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency_review.result }}
          AUTOMATION_RESULT: ${{ needs.automation.result }}
          WINDOWS_AUTOMATION_RESULT: ${{ needs.windows_automation.result }}
          BRIDGE_RESULT: ${{ needs.generate_bridge.result }}
          WINDOWS_RUST_RESULT: ${{ needs.windows_rust.result }}
          WINDOWS_PORTABLE_RESULT: ${{ needs.windows_portable.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          failure=false
          require_success() {
            local name="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "$name must succeed, got: $result" >&2
              failure=true
            fi
          }

          require_success "change classification" "$CLASSIFY_RESULT"
          require_success "component version validation" "$METADATA_RESULT"
          if [[ "$AUTOMATION_REQUIRED" == "true" ]]; then
            require_success "workflow and build automation" "$AUTOMATION_RESULT"
            require_success "Windows build automation" "$WINDOWS_AUTOMATION_RESULT"
          fi
          if [[ "$RUNTIME_REQUIRED" == "true" ]]; then
            require_success "bridge generation" "$BRIDGE_RESULT"
            require_success "Windows Rust smoke check" "$WINDOWS_RUST_RESULT"
            require_success "Windows portable smoke checks" "$WINDOWS_PORTABLE_RESULT"
            require_success "Rust, Flutter, and Web quality" "$QUALITY_RESULT"
          fi
          if [[ "$EVENT_NAME" == "pull_request" && "$DEPENDENCIES_CHANGED" == "true" ]]; then
            require_success "dependency review" "$DEPENDENCY_REVIEW_RESULT"
          fi
          if [[ "$failure" == "true" ]]; then
            exit 1
          fi
