name: Dependency Security Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

concurrency:
  group: dependency-security-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Audit pinned dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit portable Python dependencies
        run: bash .github/scripts/audit_python_dependencies.sh
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # zizmor: ignore[superfluous-actions] The pinned action installs the exact audit toolchain consistently.
        with:
          toolchain: "1.99.1"
      - name: Install pinned auditor
        run: cargo install cargo-audit --version 0.22.2 --locked --no-default-features
      - name: Audit dependency lock
        run: python3 .github/scripts/audit_cargo_dependencies.py
