name: Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Commit or ref reachable from the default branch; blank uses the default branch"
        required: false
        type: string
        default: ""
      publish:
        description: "Publish the version tag and release assets after all builds succeed"
        required: true
        default: false
        type: boolean
      build_windows_x64:
        description: "Build Windows x64 package"
        required: true
        default: true
        type: boolean
      build_windows_arm64:
        description: "Build Windows arm64 package"
        required: true
        default: true
        type: boolean
      build_macos_universal:
        description: "Build macOS universal package"
        required: true
        default: true
        type: boolean
      build_linux_x64:
        description: "Build Linux x64 package"
        required: true
        default: true
        type: boolean
      build_linux_arm64:
        description: "Build Linux arm64 package"
        required: true
        default: true
        type: boolean
      build_android_arm64:
        description: "Build Android arm64 APK/AAB"
        required: true
        default: true
        type: boolean
      build_ios:
        description: "Build iOS archive"
        required: true
        default: false
        type: boolean
      build_web:
        description: "Build web bundle"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: client-release
  cancel-in-progress: false

env:
  CAMELLIA_REMOTE_DOCS_HOME_URL: ${{ github.server_url }}/${{ github.repository }}
  CAMELLIA_REMOTE_LINUX_DISPLAY_DOCS_URL: ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/platform-notes.md#linux-display-requirements
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.1"
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: "3.44.5"
  FLUTTER_REVISION: f94f4fc76b4d74543ed9b085bbd75341ef65de22
  COCOAPODS_VERSION: "1.17.0"
  NODE_VERSION: "24.18.0"
  ANDROID_NDK_VERSION: "28.2.13676358"
  IOS_BUNDLE_ID: com.camellia.remote
  DEPENDENCY_MODE: locked
  RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
  RENDEZVOUS_SERVERS: ${{ vars.RENDEZVOUS_SERVERS || secrets.RENDEZVOUS_SERVERS }}
  API_SERVER: ${{ vars.API_SERVER || secrets.API_SERVER }}

jobs:
  prepare:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.meta.outputs.commit }}
      ci_run_id: ${{ steps.meta.outputs.ci_run_id }}
      bridge_artifact: ${{ steps.meta.outputs.bridge_artifact }}
      camellia_remote_protocol: ${{ steps.meta.outputs.camellia_remote_protocol }}
      source_date_epoch: ${{ steps.meta.outputs.source_date_epoch }}
      version: ${{ steps.version.outputs.version }}
      app_version: ${{ steps.version.outputs.app_version }}
      build_number: ${{ steps.version.outputs.build_number }}
      release_tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Validate selected release outputs
        shell: bash
        env:
          WINDOWS_X64: ${{ inputs.build_windows_x64 }}
          WINDOWS_ARM64: ${{ inputs.build_windows_arm64 }}
          MACOS: ${{ inputs.build_macos_universal }}
          LINUX_X64: ${{ inputs.build_linux_x64 }}
          LINUX_ARM64: ${{ inputs.build_linux_arm64 }}
          ANDROID: ${{ inputs.build_android_arm64 }}
          IOS: ${{ inputs.build_ios }}
          WEB: ${{ inputs.build_web }}
        run: |
          if [[ "$WINDOWS_X64" != "true" && "$WINDOWS_ARM64" != "true" \
            && "$MACOS" != "true" && "$LINUX_X64" != "true" \
            && "$LINUX_ARM64" != "true" && "$ANDROID" != "true" \
            && "$IOS" != "true" && "$WEB" != "true" ]]; then
            echo "select at least one release output" >&2
            exit 1
          fi

      - name: Require the trusted publication workflow
        if: inputs.publish
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          expected="$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/$DEFAULT_BRANCH"
          [[ "$WORKFLOW_REF" == "$expected" ]] || {
            echo "Formal publication must run the default-branch workflow: $expected" >&2
            exit 1
          }

      - name: Checkout trusted release policy
        if: inputs.publish
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Release policy token
        if: inputs.publish
        id: policy-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: write
          permission-metadata: read

      - name: Validate hosted release policy
        if: inputs.publish
        env:
          GH_TOKEN: ${{ steps.policy-token.outputs.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_APP_SLUG: ${{ steps.policy-token.outputs.app-slug }}
        run: bash .github/scripts/validate-github-release-policy.sh

      - name: Checkout source metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Test and validate component version
        id: version
        run: |
          python3 -m unittest discover -s .github/scripts/tests -v
          python3 .github/scripts/release_metadata.py --github-output

      - name: Resolve verified release source
        id: meta
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          commit="$(git rev-parse HEAD)"
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$commit" "origin/$DEFAULT_BRANCH"; then
            echo "release source $commit is not reachable from $DEFAULT_BRANCH" >&2
            exit 1
          fi

          if [[ "$PUBLISH" == "true" ]]; then
            for candidate_tag in "$RELEASE_TAG" "$VERSION"; do
              if git ls-remote --exit-code --tags origin "refs/tags/$candidate_tag" >/dev/null 2>&1; then
                echo "release version already has a tag: $candidate_tag" >&2
                exit 1
              fi
            done
          fi

          runs_json="$(
            gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$commit" \
              -f status=success \
              -f per_page=100
          )"
          ci_run_id="$(
            printf '%s' "$runs_json" |
              python3 .github/scripts/select_release_ci_run.py \
                --commit "$commit" \
                --default-branch "$DEFAULT_BRANCH"
          )"

          bridge_artifact="bridge-generated-$commit"
          artifacts_json="$(
            gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run_id/artifacts" \
              -f per_page=100
          )"
          artifact_count="$(
            jq -r --arg artifact "$bridge_artifact" \
              '[.artifacts[] | select(.name == $artifact and .expired == false)] | length' \
              <<< "$artifacts_json"
          )"
          if [[ "$artifact_count" != "1" ]]; then
            echo "CI run $ci_run_id must contain one unexpired $bridge_artifact artifact" >&2
            exit 1
          fi

          source_date_epoch="$(git show -s --format=%ct "$commit")"
          camellia_remote_protocol="$(git ls-tree "$commit" -- libs/camellia_remote_protocol | awk '$2 == "commit" { print $3 }')"
          if [[ ! "$camellia_remote_protocol" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release source does not pin one full camellia_remote_protocol commit" >&2
            exit 1
          fi
          {
            echo "bridge_artifact=$bridge_artifact"
            echo "ci_run_id=$ci_run_id"
            echo "commit=$commit"
            echo "camellia_remote_protocol=$camellia_remote_protocol"
            echo "source_date_epoch=$source_date_epoch"
          } >> "$GITHUB_OUTPUT"

      - name: Validate release configuration
        run: python3 .github/scripts/validate_build_config.py

      - name: Summarize release candidate
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          CI_RUN_ID: ${{ steps.meta.outputs.ci_run_id }}
          RELEASE_COMMIT: ${{ steps.meta.outputs.commit }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          HBB_COMMON_COMMIT: ${{ steps.meta.outputs.camellia_remote_protocol }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          {
            echo "### Client release candidate"
            echo
            echo "- Version: \`$APP_VERSION\` (\`$RELEASE_TAG\`)"
            echo "- Commit: \`$RELEASE_COMMIT\`"
            echo "- camellia_remote_protocol: \`$HBB_COMMON_COMMIT\`"
            echo "- Reused CI run: \`$CI_RUN_ID\`"
            echo "- Publish: \`$PUBLISH\`"
          } >> "$GITHUB_STEP_SUMMARY"

  approval:
    name: Approve production release
    if: inputs.publish
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    steps:
      - name: Record approval gate
        run: echo "Production release approved for ${{ needs.prepare.outputs.release_tag }}"

  build_windows_x64:
    name: Windows x64
    needs: [prepare, approval]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped') &&
      inputs.build_windows_x64
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare.outputs.bridge_artifact }}
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.ci_run_id }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc
      - uses: ./.github/actions/setup-flutter
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: C:\vcpkg
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
      - name: Resolve Windows signing mode
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERTIFICATE_SHA256: ${{ inputs.publish && vars.WINDOWS_CODESIGN_CERTIFICATE_SHA256 || '' }}
          WINDOWS_CODESIGN_CERTIFICATE_THUMBPRINT: ${{ inputs.publish && vars.WINDOWS_CODESIGN_CERTIFICATE_THUMBPRINT || '' }}
          WINDOWS_CODESIGN_PFX_BASE64: ${{ inputs.publish && secrets.WINDOWS_CODESIGN_PFX_BASE64 || '' }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ inputs.publish && secrets.WINDOWS_CODESIGN_PFX_PASSWORD || '' }}
          WINDOWS_SIGNING_TRUST_MODE: ${{ inputs.publish && vars.WINDOWS_SIGNING_TRUST_MODE || '' }}
        run: ./.github/scripts/resolve-windows-signing.ps1
      - name: Build
        shell: bash
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows-static
        run: |
          bash .github/scripts/sync-version.sh \
            "${{ needs.prepare.outputs.version }}" \
            "${{ needs.prepare.outputs.build_number }}" \
            "${{ needs.prepare.outputs.source_date_epoch }}"
          bash .github/scripts/prepare-dependencies.sh "${{ env.DEPENDENCY_MODE }}"
          "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"
          export SODIUM_LIB_DIR="$VCPKG_ROOT/installed/x64-windows-static/lib"
          cargo build --locked --release --lib --features flutter,hwcodec,vram
          (cd flutter && flutter build windows --release)
          mkdir -p artifacts
      - name: Sign and verify Windows application payload
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ inputs.publish && secrets.WINDOWS_CODESIGN_PFX_PASSWORD || '' }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: |
          $applicationDirectory = 'flutter/build/windows/x64/runner/Release'
          $ownedFiles = @("$applicationDirectory/camellia-remote.exe")
          $nativeLibraries = @(
            Get-ChildItem -LiteralPath $applicationDirectory -Recurse -File -Filter 'camellia_remote.dll'
          )
          if ($nativeLibraries.Count -ne 1) {
            throw "Expected one Camellia native library; found $($nativeLibraries.Count)"
          }
          $ownedFiles += $nativeLibraries.FullName
          ./.github/scripts/sign-windows-artifacts.ps1 -Path $ownedFiles
      - name: Build Windows installers
        shell: pwsh
        run: |
          python -m pip install -r libs/portable/requirements.txt
          python libs/portable/generate.py `
            -f flutter/build/windows/x64/runner/Release `
            -o libs/portable `
            -e camellia-remote.exe `
            -t x86_64-pc-windows-msvc
          Copy-Item target/x86_64-pc-windows-msvc/release/camellia-remote-portable-packer.exe `
            artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-windows-x64-portable.exe
          Push-Location res/msi
          python preprocess.py --arp `
            --architecture x64 --app-name "Camellia Remote" `
            -v "${{ needs.prepare.outputs.version }}"
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          Copy-Item $msi.FullName ../../artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-windows-x64.msi
          Pop-Location
      - name: Sign and verify Windows artifacts
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ inputs.publish && secrets.WINDOWS_CODESIGN_PFX_PASSWORD || '' }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: |
          $ownedFiles = @(
            'artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-windows-x64-portable.exe',
            'artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-windows-x64.msi'
          )
          ./.github/scripts/sign-windows-artifacts.ps1 -Path $ownedFiles
      - name: Package Windows artifacts and signing metadata
        shell: pwsh
        run: |
          Compress-Archive `
            -Path 'flutter/build/windows/x64/runner/Release/*' `
            -DestinationPath 'artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-windows-x64.zip' `
            -Force
          $metadata = @(
            '.github/scripts/signing_metadata.py',
            'write',
            '--output', 'artifacts/native-signing-windows-x64.json',
            '--artifact-directory', 'artifacts',
            '--platform', 'windows',
            '--architecture', 'x64',
            '--native-signing', $env:WINDOWS_NATIVE_SIGNING,
            '--distribution-trust', $env:WINDOWS_DISTRIBUTION_TRUST,
            '--delivery', 'installable'
          )
          if ($env:WINDOWS_SIGNING_IDENTITY) {
            $metadata += @('--identity', $env:WINDOWS_SIGNING_IDENTITY)
          }
          python @metadata
      - name: Remove Windows signing material
        if: always()
        shell: pwsh
        run: |
          if ($env:WINDOWS_SIGNING_PFX_PATH) {
            Remove-Item -LiteralPath $env:WINDOWS_SIGNING_PFX_PATH -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: camellia-remote-${{ needs.prepare.outputs.version }}-windows-x64-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  build_windows_arm64:
    name: Windows arm64
    needs: [prepare, approval]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped') &&
      inputs.build_windows_arm64
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare.outputs.bridge_artifact }}
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.ci_run_id }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-pc-windows-msvc
      - name: Install Flutter stable from source
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:FLUTTER_VERSION https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          $revision = (git -C "$env:RUNNER_TEMP\flutter" rev-parse HEAD).Trim()
          if ($revision -ne $env:FLUTTER_REVISION) {
            throw "Unexpected Flutter revision: $revision"
          }
          "FLUTTER_ROOT=$env:RUNNER_TEMP\flutter" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Precache Flutter Windows
        shell: pwsh
        run: flutter.bat precache --windows
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: C:\vcpkg
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
      - name: Resolve Windows signing mode
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERTIFICATE_SHA256: ${{ inputs.publish && vars.WINDOWS_CODESIGN_CERTIFICATE_SHA256 || '' }}
          WINDOWS_CODESIGN_CERTIFICATE_THUMBPRINT: ${{ inputs.publish && vars.WINDOWS_CODESIGN_CERTIFICATE_THUMBPRINT || '' }}
          WINDOWS_CODESIGN_PFX_BASE64: ${{ inputs.publish && secrets.WINDOWS_CODESIGN_PFX_BASE64 || '' }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ inputs.publish && secrets.WINDOWS_CODESIGN_PFX_PASSWORD || '' }}
          WINDOWS_SIGNING_TRUST_MODE: ${{ inputs.publish && vars.WINDOWS_SIGNING_TRUST_MODE || '' }}
        run: ./.github/scripts/resolve-windows-signing.ps1
      - name: Build
        shell: bash
        env:
          VCPKG_DEFAULT_TRIPLET: arm64-windows-static
        run: |
          bash .github/scripts/sync-version.sh \
            "${{ needs.prepare.outputs.version }}" \
            "${{ needs.prepare.outputs.build_number }}" \
            "${{ needs.prepare.outputs.source_date_epoch }}"
          bash .github/scripts/prepare-dependencies.sh "${{ env.DEPENDENCY_MODE }}"
          "$VCPKG_ROOT/vcpkg" install --triplet arm64-windows-static --x-install-root="$VCPKG_ROOT/installed"
          export SODIUM_LIB_DIR="$VCPKG_ROOT/installed/arm64-windows-static/lib"
          cargo build --locked --release --target aarch64-pc-windows-msvc --lib --features flutter,hwcodec
          mkdir -p target/release
          cp target/aarch64-pc-windows-msvc/release/camellia_remote.dll target/release/camellia_remote.dll
          (cd flutter && flutter.bat build windows --release)
          mkdir -p artifacts
      - name: Sign and verify Windows application payload
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ inputs.publish && secrets.WINDOWS_CODESIGN_PFX_PASSWORD || '' }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: |
          $applicationDirectory = 'flutter/build/windows/arm64/runner/Release'
          $ownedFiles = @("$applicationDirectory/camellia-remote.exe")
          $nativeLibraries = @(
            Get-ChildItem -LiteralPath $applicationDirectory -Recurse -File -Filter 'camellia_remote.dll'
          )
          if ($nativeLibraries.Count -ne 1) {
            throw "Expected one Camellia native library; found $($nativeLibraries.Count)"
          }
          $ownedFiles += $nativeLibraries.FullName
          ./.github/scripts/sign-windows-artifacts.ps1 -Path $ownedFiles
      - name: Build Windows installers
        shell: pwsh
        run: |
          python -m pip install -r libs/portable/requirements.txt
          python libs/portable/generate.py `
            -f flutter/build/windows/arm64/runner/Release `
            -o libs/portable `
            -e camellia-remote.exe `
            -t aarch64-pc-windows-msvc
          Copy-Item target/aarch64-pc-windows-msvc/release/camellia-remote-portable-packer.exe `
            artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-windows-arm64-portable.exe
          Push-Location res/msi
          python preprocess.py --arp `
            --architecture arm64 --app-name "Camellia Remote" `
            -v "${{ needs.prepare.outputs.version }}"
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=ARM64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          Copy-Item $msi.FullName ../../artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-windows-arm64.msi
          Pop-Location
      - name: Sign and verify Windows artifacts
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ inputs.publish && secrets.WINDOWS_CODESIGN_PFX_PASSWORD || '' }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: |
          $ownedFiles = @(
            'artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-windows-arm64-portable.exe',
            'artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-windows-arm64.msi'
          )
          ./.github/scripts/sign-windows-artifacts.ps1 -Path $ownedFiles
      - name: Package Windows artifacts and signing metadata
        shell: pwsh
        run: |
          Compress-Archive `
            -Path 'flutter/build/windows/arm64/runner/Release/*' `
            -DestinationPath 'artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-windows-arm64.zip' `
            -Force
          $metadata = @(
            '.github/scripts/signing_metadata.py',
            'write',
            '--output', 'artifacts/native-signing-windows-arm64.json',
            '--artifact-directory', 'artifacts',
            '--platform', 'windows',
            '--architecture', 'arm64',
            '--native-signing', $env:WINDOWS_NATIVE_SIGNING,
            '--distribution-trust', $env:WINDOWS_DISTRIBUTION_TRUST,
            '--delivery', 'installable'
          )
          if ($env:WINDOWS_SIGNING_IDENTITY) {
            $metadata += @('--identity', $env:WINDOWS_SIGNING_IDENTITY)
          }
          python @metadata
      - name: Remove Windows signing material
        if: always()
        shell: pwsh
        run: |
          if ($env:WINDOWS_SIGNING_PFX_PATH) {
            Remove-Item -LiteralPath $env:WINDOWS_SIGNING_PFX_PATH -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: camellia-remote-${{ needs.prepare.outputs.version }}-windows-arm64-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  build_macos_universal:
    name: macOS universal
    needs: [prepare, approval]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped') &&
      inputs.build_macos_universal
    runs-on: macos-26
    timeout-minutes: 90
    env:
      XCODE_VERSION: "26.2"
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
          submodules: recursive
      - name: Verify Xcode toolchain
        run: bash .github/scripts/verify-xcode.sh "${{ env.XCODE_VERSION }}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare.outputs.bridge_artifact }}
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.ci_run_id }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: ./.github/actions/setup-flutter
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve macOS signing mode
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ inputs.publish && vars.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ inputs.publish && vars.APPLE_API_KEY || '' }}
          APPLE_API_PRIVATE_KEY: ${{ inputs.publish && secrets.APPLE_API_PRIVATE_KEY || '' }}
          APPLE_CERTIFICATE: ${{ inputs.publish && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ inputs.publish && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_CERTIFICATE_SHA256: ${{ inputs.publish && vars.APPLE_SIGNING_CERTIFICATE_SHA256 || '' }}
          APPLE_SIGNING_IDENTITY: ${{ inputs.publish && vars.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_SIGNING_TRUST_MODE: ${{ inputs.publish && vars.APPLE_SIGNING_TRUST_MODE || '' }}
        run: |
          SIGNING_ENV_FILE="$GITHUB_ENV" SIGNING_TEMP_DIRECTORY="$RUNNER_TEMP" \
            bash .github/scripts/resolve-macos-signing.sh
      - name: Import macOS signing identity
        if: env.MACOS_NATIVE_SIGNING == 'signed' || env.MACOS_NATIVE_SIGNING == 'notarized'
        shell: bash
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ inputs.publish && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
        run: |
          SIGNING_ENV_FILE="$GITHUB_ENV" SIGNING_TEMP_DIRECTORY="$RUNNER_TEMP" \
            bash .github/scripts/prepare-macos-signing.sh
      - name: Install macOS prerequisites
        run: bash .github/scripts/install-apple-prerequisites.sh
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: ${{ runner.temp }}/vcpkg
      - name: Build
        shell: bash
        run: |
          bash .github/scripts/sync-version.sh \
            "${{ needs.prepare.outputs.version }}" \
            "${{ needs.prepare.outputs.build_number }}" \
            "${{ needs.prepare.outputs.source_date_epoch }}"
          bash .github/scripts/prepare-dependencies.sh "${{ env.DEPENDENCY_MODE }}"
          bash .github/scripts/verify-apple-pod-locks.sh macos
          "$VCPKG_ROOT/vcpkg" install --triplet arm64-osx --x-install-root="$VCPKG_ROOT/installed"
          cargo build --locked --release --target aarch64-apple-darwin --lib --features flutter,hwcodec,screencapturekit,unix-file-copy-paste
          "$VCPKG_ROOT/vcpkg" install --triplet x64-osx --x-install-root="$VCPKG_ROOT/installed"
          cargo build --locked --release --target x86_64-apple-darwin --lib --features flutter,hwcodec,screencapturekit,unix-file-copy-paste
          mkdir -p target/release
          lipo -create \
            target/aarch64-apple-darwin/release/libcamellia_remote.dylib \
            target/x86_64-apple-darwin/release/libcamellia_remote.dylib \
            -output target/release/libcamellia_remote.dylib
          (cd flutter && FLUTTER_XCODE_ARCHS="arm64 x86_64" flutter build macos --release)
      - name: Reject Apple build source migrations
        if: always()
        run: bash .github/scripts/verify-clean-source.sh
      - name: Stage and verify macOS artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          bash .github/scripts/stage-macos-release.sh \
            flutter/build/macos/Build/Products/Release \
            artifacts
      - name: Record macOS signing metadata
        shell: bash
        run: |
          metadata=(
            write
            --output artifacts/native-signing-macos-universal.json
            --artifact-directory artifacts
            --platform macos
            --architecture universal
            --native-signing "$MACOS_NATIVE_SIGNING"
            --distribution-trust "$MACOS_DISTRIBUTION_TRUST"
            --delivery installable
          )
          if [[ -n "${MACOS_SIGNING_IDENTITY:-}" ]]; then
            metadata+=(--identity "$MACOS_SIGNING_IDENTITY")
          fi
          python3 .github/scripts/signing_metadata.py "${metadata[@]}"
      - name: Remove macOS signing material
        if: always()
        shell: bash
        run: bash .github/scripts/cleanup-macos-signing.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: camellia-remote-${{ needs.prepare.outputs.version }}-macos-universal-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  build_linux:
    name: Linux ${{ matrix.arch }}
    needs: [prepare, approval]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped') &&
      (inputs.build_linux_x64 || inputs.build_linux_arm64)
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            vcpkg_triplet: x64-linux
            deb_arch: amd64
            appimage_arch: x86_64
            enabled: ${{ inputs.build_linux_x64 }}
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            vcpkg_triplet: arm64-linux
            deb_arch: arm64
            appimage_arch: aarch64
            enabled: ${{ inputs.build_linux_arm64 }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Skip disabled matrix entry
        if: ${{ !matrix.enabled }}
        run: echo "disabled"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ matrix.enabled }}
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ matrix.enabled }}
        with:
          name: ${{ needs.prepare.outputs.bridge_artifact }}
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.ci_run_id }}
      - name: Resolve Linux artifact-signing mode
        if: ${{ matrix.enabled }}
        shell: bash
        env:
          LINUX_GPG_FINGERPRINT: ${{ inputs.publish && vars.LINUX_GPG_FINGERPRINT || '' }}
          LINUX_GPG_PRIVATE_KEY: ${{ inputs.publish && secrets.LINUX_GPG_PRIVATE_KEY || '' }}
          LINUX_GPG_PASSPHRASE: ${{ inputs.publish && secrets.LINUX_GPG_PASSPHRASE || '' }}
        run: SIGNING_ENV_FILE="$GITHUB_ENV" bash .github/scripts/resolve-linux-signing.sh
      - name: Install prerequisites
        if: ${{ matrix.enabled }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl gcc g++ git libasound2-dev libclang-dev libdbus-1-dev libglib2.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev libaom-dev libopus-dev \
            libpam0g-dev libpulse-dev libva-dev libx11-dev libxi-dev libxtst-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxdo-dev libxfixes-dev libvpx-dev libyuv-dev gnupg nasm ninja-build pkg-config unzip wget
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        if: ${{ matrix.enabled }}
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: ./.github/actions/setup-flutter
        if: ${{ matrix.enabled && matrix.arch != 'arm64' }}
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Flutter stable from source
        if: ${{ matrix.enabled && matrix.arch == 'arm64' }}
        shell: bash
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          revision="$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)"
          if [[ "$revision" != "$FLUTTER_REVISION" ]]; then
            echo "Unexpected Flutter revision: $revision" >&2
            exit 1
          fi
          echo "FLUTTER_ROOT=$RUNNER_TEMP/flutter" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Precache Flutter Linux
        if: ${{ matrix.enabled && matrix.arch == 'arm64' }}
        shell: bash
        run: flutter precache --linux
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        if: ${{ matrix.enabled }}
        with:
          vcpkgDirectory: ${{ runner.temp }}/vcpkg
      - name: Build
        if: ${{ matrix.enabled }}
        shell: bash
        run: |
          bash .github/scripts/sync-version.sh \
            "${{ needs.prepare.outputs.version }}" \
            "${{ needs.prepare.outputs.build_number }}" \
            "${{ needs.prepare.outputs.source_date_epoch }}"
          bash .github/scripts/prepare-dependencies.sh "${{ env.DEPENDENCY_MODE }}"
          "$VCPKG_ROOT/vcpkg" install --triplet "${{ matrix.vcpkg_triplet }}" --x-install-root="$VCPKG_ROOT/installed"
          cargo build --locked --release --target "${{ matrix.target }}" --lib --features flutter,hwcodec,unix-file-copy-paste
          mkdir -p target/release
          cp "target/${{ matrix.target }}/release/libcamellia_remote.so" target/release/libcamellia_remote.so
          (cd flutter && flutter build linux --release)
          mkdir -p artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}
          cp -R flutter/build/linux/*/release/bundle/* artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}/
          tar -C artifacts -czf artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}.tar.gz camellia-remote-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}
          rm -rf artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}
          bash .github/scripts/package-linux.sh \
            "${{ needs.prepare.outputs.version }}" \
            "${{ matrix.arch }}" \
            "${{ matrix.deb_arch }}" \
            "${{ matrix.appimage_arch }}"
      - name: Sign and verify Linux artifacts
        if: ${{ matrix.enabled && env.ARTIFACT_SIGNING == 'openpgp-detached' }}
        shell: bash
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ inputs.publish && secrets.LINUX_GPG_PRIVATE_KEY || '' }}
          LINUX_GPG_PASSPHRASE: ${{ inputs.publish && secrets.LINUX_GPG_PASSPHRASE || '' }}
        run: |
          name="camellia-remote-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}"
          public_key="artifacts/$name.signing-key.asc"
          artifacts=(
            "artifacts/$name.tar.gz"
            "artifacts/$name.deb"
            "artifacts/$name.AppImage"
          )
          LINUX_GPG_PUBLIC_KEY_OUTPUT="$public_key" \
            bash .github/scripts/linux-openpgp-sign.sh "${artifacts[@]}"
          LINUX_GPG_PUBLIC_KEY="$public_key" \
            bash .github/scripts/linux-openpgp-verify.sh "${artifacts[@]}"
      - name: Record Linux signing metadata
        if: ${{ matrix.enabled }}
        shell: bash
        run: |
          metadata=(
            write
            --output "artifacts/native-signing-linux-${{ matrix.arch }}.json"
            --artifact-directory artifacts
            --platform linux
            --architecture "${{ matrix.arch }}"
            --native-signing not-applicable
            --distribution-trust not-applicable
            --artifact-signing "$ARTIFACT_SIGNING"
            --delivery installable
          )
          if [[ "$ARTIFACT_SIGNING" == openpgp-detached ]]; then
            metadata+=(--artifact-signing-identity "$LINUX_GPG_FINGERPRINT")
          fi
          python3 .github/scripts/signing_metadata.py "${metadata[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ matrix.enabled }}
        with:
          name: camellia-remote-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/*.tar.gz
            artifacts/*.deb
            artifacts/*.AppImage
            artifacts/*.asc
            artifacts/native-signing-*.json
          if-no-files-found: error
          retention-days: 7

  build_android_arm64:
    name: Android arm64
    needs: [prepare, approval]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped') &&
      inputs.build_android_arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # The Android toolchain, Flutter cache, vcpkg, and Rust artifacts exceed
      # the free space available on some runners unless unused preinstalls are removed.
      - name: Reclaim disk space for Android build
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare.outputs.bridge_artifact }}
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.ci_run_id }}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Resolve Android signing mode
        shell: bash
        env:
          ANDROID_SIGNING_KEY: ${{ inputs.publish && secrets.ANDROID_SIGNING_KEY || '' }}
          ANDROID_KEY_STORE_PASSWORD: ${{ inputs.publish && secrets.ANDROID_KEY_STORE_PASSWORD || '' }}
          ANDROID_KEY_PASSWORD: ${{ inputs.publish && secrets.ANDROID_KEY_PASSWORD || '' }}
          ANDROID_ALIAS: ${{ inputs.publish && secrets.ANDROID_ALIAS || '' }}
          ANDROID_SIGNING_CERTIFICATE_SHA256: ${{ inputs.publish && vars.ANDROID_SIGNING_CERTIFICATE_SHA256 || '' }}
        run: |
          SIGNING_ENV_FILE="$GITHUB_ENV" SIGNING_TEMP_DIRECTORY="$RUNNER_TEMP" \
            bash .github/scripts/resolve-android-signing.sh
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android
      - uses: ./.github/actions/setup-flutter
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: ${{ runner.temp }}/vcpkg
      - name: Install host build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm ninja-build pkg-config
      - name: Install pinned NDK
        shell: bash
        run: |
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        env:
          ANDROID_KEY_STORE_PASSWORD: ${{ inputs.publish && secrets.ANDROID_KEY_STORE_PASSWORD || '' }}
          ANDROID_KEY_PASSWORD: ${{ inputs.publish && secrets.ANDROID_KEY_PASSWORD || '' }}
          CAMELLIA_FORMAL_RELEASE: "true"
        run: |
          bash .github/scripts/sync-version.sh \
            "${{ needs.prepare.outputs.version }}" \
            "${{ needs.prepare.outputs.build_number }}" \
            "${{ needs.prepare.outputs.source_date_epoch }}"
          bash .github/scripts/prepare-dependencies.sh "${{ env.DEPENDENCY_MODE }}"
          "$VCPKG_ROOT/vcpkg" install --triplet arm64-android --x-install-root="$VCPKG_ROOT/installed"
          android_api=26
          ndk_toolchain="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
          android_cc="$ndk_toolchain/bin/aarch64-linux-android${android_api}-clang"
          android_cxx="$ndk_toolchain/bin/aarch64-linux-android${android_api}-clang++"
          android_flags="--target=aarch64-linux-android${android_api} --sysroot=$ndk_toolchain/sysroot -D__ANDROID_API__=${android_api}"
          export CC_aarch64_linux_android="$android_cc"
          export CXX_aarch64_linux_android="$android_cxx"
          export AR_aarch64_linux_android="$ndk_toolchain/bin/llvm-ar"
          export RANLIB_aarch64_linux_android="$ndk_toolchain/bin/llvm-ranlib"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$android_cc"
          export CFLAGS_aarch64_linux_android="$android_flags"
          export CXXFLAGS_aarch64_linux_android="$android_flags"
          export BINDGEN_EXTRA_CLANG_ARGS="$android_flags -I$VCPKG_ROOT/installed/arm64-android/include"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="$BINDGEN_EXTRA_CLANG_ARGS"
          # mediacodec (Android hardware decode) is intentionally absent: the
          # module in libs/scrap has drifted from the current ImageRgb/CodecFormat
          # APIs and does not compile. Re-add it together with the fixes, verified
          # against a real Android NDK toolchain.
          cargo build --locked --release --target aarch64-linux-android --lib --no-default-features --features use_dasp,flutter,hwcodec
          mkdir -p flutter/android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libcamellia_remote.so flutter/android/app/src/main/jniLibs/arm64-v8a/camellia_remote.so
          (cd flutter && flutter build apk --release --target-platform android-arm64)
          (cd flutter && flutter build appbundle --release --target-platform android-arm64)
          mkdir -p artifacts
          mapfile -t apk_candidates < <(
            find flutter/build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*release*.apk'
          )
          mapfile -t aab_candidates < <(
            find flutter/build/app/outputs/bundle/release -maxdepth 1 -type f -name '*.aab'
          )
          [[ "${#apk_candidates[@]}" == 1 && "${#aab_candidates[@]}" == 1 ]] || {
            echo "Expected exactly one release APK and AAB" >&2
            exit 1
          }
          apk="${apk_candidates[0]}"
          aab="${aab_candidates[0]}"
          apk_output="artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-android-arm64${ANDROID_ARTIFACT_SUFFIX}.apk"
          aab_output="artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-android-arm64${ANDROID_ARTIFACT_SUFFIX}.aab"
          cp "$apk" "$apk_output"
          cp "$aab" "$aab_output"

          build_tools="$(
            find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -print |
              sort -V |
              tail -n 1
          )"
          apksigner="$build_tools/apksigner"
          [[ -x "$apksigner" ]] || {
            echo "apksigner was not found in the installed Android build tools" >&2
            exit 1
          }
          if [[ "$ANDROID_NATIVE_SIGNING" == signed ]]; then
            certificate_sha256="$(
              "$apksigner" verify --verbose --print-certs "$apk_output" |
                sed -n 's/^Signer #1 certificate SHA-256 digest: //p' |
                tr '[:lower:]' '[:upper:]'
            )"
            [[ "$certificate_sha256" == "$ANDROID_SIGNING_IDENTITY" ]] || {
              echo "Android APK signer does not match the resolved keystore identity" >&2
              exit 1
            }
            aab_verification="$(
              jarsigner -J-Duser.language=en -verify -verbose -certs "$aab_output" 2>&1
            )"
            grep -F 'jar verified.' <<< "$aab_verification" >/dev/null || {
              echo "Android AAB signature verification failed" >&2
              exit 1
            }
          else
            if "$apksigner" verify "$apk_output" >/dev/null 2>&1; then
              echo "Android unsigned APK unexpectedly contains a valid signature" >&2
              exit 1
            fi
            aab_verification="$(
              jarsigner -J-Duser.language=en -verify -verbose -certs "$aab_output" 2>&1
            )"
            if grep -F 'jar verified.' <<< "$aab_verification" >/dev/null; then
              echo "Android unsigned AAB unexpectedly contains a verified signature" >&2
              exit 1
            fi
            if ! grep -F 'jar is unsigned.' <<< "$aab_verification" >/dev/null; then
              echo "Android unsigned AAB did not report the expected unsigned state" >&2
              exit 1
            fi
          fi
      - name: Record Android signing metadata
        shell: bash
        run: |
          trust=none
          delivery=re-signing-input
          metadata=(
            write
            --output artifacts/native-signing-android-arm64.json
            --artifact-directory artifacts
            --platform android
            --architecture arm64
            --native-signing "$ANDROID_NATIVE_SIGNING"
            --distribution-trust none
            --delivery "$delivery"
          )
          if [[ "$ANDROID_NATIVE_SIGNING" == signed ]]; then
            trust=platform-key
            delivery=installable
            metadata=(
              write
              --output artifacts/native-signing-android-arm64.json
              --artifact-directory artifacts
              --platform android
              --architecture arm64
              --native-signing signed
              --distribution-trust "$trust"
              --identity "$ANDROID_SIGNING_IDENTITY"
              --delivery "$delivery"
            )
          fi
          python3 .github/scripts/signing_metadata.py "${metadata[@]}"
      - name: Remove Android signing material
        if: always()
        shell: bash
        run: rm -f -- "${CAMELLIA_ANDROID_STORE_FILE:-}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: camellia-remote-${{ needs.prepare.outputs.version }}-android-arm64-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  build_ios:
    name: iOS
    needs: [prepare, approval]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped') &&
      inputs.build_ios
    runs-on: macos-26
    timeout-minutes: 90
    env:
      XCODE_VERSION: "26.2"
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      IPHONEOS_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
          submodules: recursive
      - name: Verify Xcode toolchain
        run: bash .github/scripts/verify-xcode.sh "${{ env.XCODE_VERSION }}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare.outputs.bridge_artifact }}
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.ci_run_id }}
      - name: Resolve iOS signing mode
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ inputs.publish && secrets.IOS_CERTIFICATE_BASE64 || '' }}
          IOS_CERTIFICATE_PASSWORD: ${{ inputs.publish && secrets.IOS_CERTIFICATE_PASSWORD || '' }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ inputs.publish && secrets.IOS_PROVISIONING_PROFILE_BASE64 || '' }}
          IOS_SIGNING_CERTIFICATE_SHA256: ${{ inputs.publish && vars.IOS_SIGNING_CERTIFICATE_SHA256 || '' }}
          IOS_SIGNING_IDENTITY: ${{ inputs.publish && vars.IOS_SIGNING_IDENTITY || '' }}
          IOS_TEAM_ID: ${{ inputs.publish && vars.IOS_TEAM_ID || '' }}
          IOS_EXPORT_METHOD: ${{ inputs.publish && vars.IOS_EXPORT_METHOD || '' }}
        run: |
          SIGNING_ENV_FILE="$GITHUB_ENV" SIGNING_TEMP_DIRECTORY="$RUNNER_TEMP" \
            bash .github/scripts/resolve-ios-signing.sh
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-ios
      - uses: ./.github/actions/setup-flutter
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install iOS prerequisites
        run: bash .github/scripts/install-apple-prerequisites.sh
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: ${{ runner.temp }}/vcpkg
      - name: Prepare iOS signing identity and profile
        if: env.IOS_NATIVE_SIGNING == 'signed'
        shell: bash
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ inputs.publish && secrets.IOS_CERTIFICATE_PASSWORD || '' }}
          IOS_SIGNING_CERTIFICATE_SHA256: ${{ inputs.publish && vars.IOS_SIGNING_CERTIFICATE_SHA256 || '' }}
          IOS_SIGNING_IDENTITY: ${{ inputs.publish && vars.IOS_SIGNING_IDENTITY || '' }}
          IOS_TEAM_ID: ${{ inputs.publish && vars.IOS_TEAM_ID || '' }}
          IOS_EXPORT_METHOD: ${{ inputs.publish && vars.IOS_EXPORT_METHOD || '' }}
          IOS_SIGNING_XCCONFIG_PATH: ${{ github.workspace }}/flutter/ios/Flutter/Signing.xcconfig
        run: |
          SIGNING_ENV_FILE="$GITHUB_ENV" SIGNING_TEMP_DIRECTORY="$RUNNER_TEMP" \
            bash .github/scripts/prepare-ios-signing.sh
      - name: Build
        shell: bash
        env:
          IOS_SIGNING_IDENTITY: ${{ inputs.publish && vars.IOS_SIGNING_IDENTITY || '' }}
          IOS_TEAM_ID: ${{ inputs.publish && vars.IOS_TEAM_ID || '' }}
          IOS_EXPORT_METHOD: ${{ inputs.publish && vars.IOS_EXPORT_METHOD || '' }}
        run: |
          bash .github/scripts/sync-version.sh \
            "${{ needs.prepare.outputs.version }}" \
            "${{ needs.prepare.outputs.build_number }}" \
            "${{ needs.prepare.outputs.source_date_epoch }}"
          bash .github/scripts/prepare-dependencies.sh "${{ env.DEPENDENCY_MODE }}"
          bash .github/scripts/verify-apple-pod-locks.sh ios
          "$VCPKG_ROOT/vcpkg" install --triplet arm64-ios --x-install-root="$VCPKG_ROOT/installed"
          cargo build --locked --release --target aarch64-apple-ios --lib --features flutter
          bash .github/scripts/build-ios-release.sh
      - name: Reject Apple build source migrations
        if: always()
        run: bash .github/scripts/verify-clean-source.sh
      - name: Stage and verify iOS artifacts
        shell: bash
        run: >-
          bash .github/scripts/stage-ios-release.sh
          "${{ needs.prepare.outputs.version }}"
      - name: Record iOS signing metadata
        shell: bash
        run: |
          metadata=(
            write
            --output artifacts/native-signing-ios-arm64.json
            --artifact-directory artifacts
            --platform ios
            --architecture arm64
            --native-signing "$IOS_NATIVE_SIGNING"
            --distribution-trust "$IOS_DISTRIBUTION_TRUST"
          )
          if [[ "$IOS_NATIVE_SIGNING" == signed ]]; then
            metadata+=(
              --identity "$IOS_SIGNING_IDENTITY_SHA256"
              --delivery installable
            )
          else
            metadata+=(--delivery re-signing-input)
          fi
          python3 .github/scripts/signing_metadata.py "${metadata[@]}"
      - name: Remove iOS signing material
        if: always()
        shell: bash
        run: bash .github/scripts/cleanup-ios-signing.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: camellia-remote-${{ needs.prepare.outputs.version }}-ios-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  build_web:
    name: Web
    needs: [prepare, approval]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped') &&
      inputs.build_web
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
          submodules: recursive
      - uses: ./.github/actions/setup-flutter
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: flutter/web/js/package-lock.json
      - name: Build
        shell: bash
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
        run: |
          chmod +x flutter/web/tools/build_web.sh
          ./flutter/web/tools/build_web.sh --mode release
          mkdir -p artifacts
          tar -C flutter/build -czf artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-web.tar.gz web
          (cd flutter/build && zip -qry "$GITHUB_WORKSPACE/artifacts/camellia-remote-${{ needs.prepare.outputs.version }}-web.zip" web)
      - name: Record Web artifact metadata
        shell: bash
        run: |
          python3 .github/scripts/signing_metadata.py write \
            --output artifacts/native-signing-web-any.json \
            --artifact-directory artifacts \
            --platform web \
            --architecture any \
            --native-signing not-applicable \
            --distribution-trust not-applicable \
            --delivery deployment-artifact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: camellia-remote-${{ needs.prepare.outputs.version }}-web-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  finalize_candidate:
    name: Candidate evidence
    needs:
      - prepare
      - approval
      - build_windows_x64
      - build_windows_arm64
      - build_macos_universal
      - build_linux
      - build_android_arm64
      - build_ios
      - build_web
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped') &&
      (!inputs.build_windows_x64 || needs.build_windows_x64.result == 'success') &&
      (!inputs.build_windows_arm64 || needs.build_windows_arm64.result == 'success') &&
      (!inputs.build_macos_universal || needs.build_macos_universal.result == 'success') &&
      (!(inputs.build_linux_x64 || inputs.build_linux_arm64) || needs.build_linux.result == 'success') &&
      (!inputs.build_android_arm64 || needs.build_android_arm64.result == 'success') &&
      (!inputs.build_ios || needs.build_ios.result == 'success') &&
      (!inputs.build_web || needs.build_web.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout immutable candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
          submodules: recursive

      - name: Download exact-attempt platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: camellia-remote-${{ needs.prepare.outputs.version }}-*-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-inputs

      - name: Assemble exact candidate inventory
        shell: bash
        env:
          ANDROID: ${{ inputs.build_android_arm64 }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          CI_RUN_ID: ${{ needs.prepare.outputs.ci_run_id }}
          HBB_COMMON_COMMIT: ${{ needs.prepare.outputs.camellia_remote_protocol }}
          IOS: ${{ inputs.build_ios }}
          LINUX_ARM64: ${{ inputs.build_linux_arm64 }}
          LINUX_X64: ${{ inputs.build_linux_x64 }}
          MACOS: ${{ inputs.build_macos_universal }}
          PUBLISH: ${{ inputs.publish }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
          WEB: ${{ inputs.build_web }}
          WINDOWS_ARM64: ${{ inputs.build_windows_arm64 }}
          WINDOWS_X64: ${{ inputs.build_windows_x64 }}
        run: |
          args=(
            assemble
            --input-directory "$RUNNER_TEMP/release-inputs"
            --output-directory "$RUNNER_TEMP/release-assets"
            --version "$RELEASE_VERSION"
            --app-version "$APP_VERSION"
            --build-number "$BUILD_NUMBER"
            --tag "$RELEASE_TAG"
            --source-commit "$RELEASE_COMMIT"
            --protocol-commit "$HBB_COMMON_COMMIT"
            --verified-ci-run-id "$CI_RUN_ID"
            --source-date-epoch "$SOURCE_DATE_EPOCH"
            --candidate-run-id "$GITHUB_RUN_ID"
            --candidate-run-attempt "$GITHUB_RUN_ATTEMPT"
            --repository "$GITHUB_REPOSITORY"
            --workflow-ref "$GITHUB_WORKFLOW_REF"
            --publication-requested "$PUBLISH"
            --rust-toolchain "$RUST_TOOLCHAIN"
            --flutter-version "$FLUTTER_VERSION"
            --flutter-revision "$FLUTTER_REVISION"
            --node-version "$NODE_VERSION"
            --android-ndk-version "$ANDROID_NDK_VERSION"
          )
          if [[ "$WINDOWS_X64" == "true" ]]; then args+=(--selected-platform windows-x64); fi
          if [[ "$WINDOWS_ARM64" == "true" ]]; then args+=(--selected-platform windows-arm64); fi
          if [[ "$MACOS" == "true" ]]; then args+=(--selected-platform macos-universal); fi
          if [[ "$LINUX_X64" == "true" ]]; then args+=(--selected-platform linux-x64); fi
          if [[ "$LINUX_ARM64" == "true" ]]; then args+=(--selected-platform linux-arm64); fi
          if [[ "$ANDROID" == "true" ]]; then args+=(--selected-platform android-arm64); fi
          if [[ "$IOS" == "true" ]]; then args+=(--selected-platform ios); fi
          if [[ "$WEB" == "true" ]]; then args+=(--selected-platform web); fi
          python3 .github/scripts/candidate_evidence.py "${args[@]}"

      - name: Aggregate native signing evidence
        shell: bash
        run: |
          python3 .github/scripts/signing_metadata.py aggregate \
            --asset-directory "$RUNNER_TEMP/release-assets" \
            --manifest "$RUNNER_TEMP/release-assets/versions.json" \
            --report "$RUNNER_TEMP/release-assets/NATIVE-SIGNING.md"

      - name: Generate pinned SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          artifact-name: camellia-remote-${{ needs.prepare.outputs.version }}.spdx.json
          format: spdx-json
          output-file: ${{ runner.temp }}/release-assets/camellia-remote-${{ needs.prepare.outputs.version }}.spdx.json
          path: .
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false

      - name: Generate attestation subject inventory
        run: >-
          python3 .github/scripts/candidate_evidence.py checksums
          --asset-directory "$RUNNER_TEMP/release-assets"

      - name: Attest exact candidate inventory
        id: attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          create-storage-record: false
          subject-checksums: ${{ runner.temp }}/release-assets/SHA256SUMS

      - name: Cryptographically verify provenance bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/release.yml
        run: |
          [[ -f "$PROVENANCE_BUNDLE" ]] || {
            echo "attestation action did not produce a provenance bundle" >&2
            exit 1
          }
          while IFS= read -r checksum; do
            name="${checksum#*  }"
            gh attestation verify "$RUNNER_TEMP/release-assets/$name" \
              --bundle "$PROVENANCE_BUNDLE" \
              --deny-self-hosted-runners \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$SIGNER_WORKFLOW" >/dev/null
          done < "$RUNNER_TEMP/release-assets/SHA256SUMS"

      - name: Preserve provenance bundle and finalize checksums
        shell: bash
        env:
          PROVENANCE_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          [[ -f "$PROVENANCE_BUNDLE" ]] || {
            echo "attestation action did not produce a provenance bundle" >&2
            exit 1
          }
          cp -- "$PROVENANCE_BUNDLE" \
            "$RUNNER_TEMP/release-assets/camellia-remote-${RELEASE_VERSION}.provenance.intoto.jsonl"
          python3 .github/scripts/candidate_evidence.py checksums \
            --asset-directory "$RUNNER_TEMP/release-assets"

      - name: Verify final candidate evidence
        run: >-
          python3 .github/scripts/candidate_evidence.py verify
          --asset-directory "$RUNNER_TEMP/release-assets"
          --version '${{ needs.prepare.outputs.version }}'
          --source-commit '${{ needs.prepare.outputs.commit }}'

      - name: Upload consolidated candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-assets-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.commit }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Summarize candidate evidence
        shell: bash
        env:
          CANDIDATE_ARTIFACT: candidate-assets-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.commit }}-run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          {
            echo "### Consolidated candidate evidence"
            echo
            echo "- Artifact: \`$CANDIDATE_ARTIFACT\`"
            echo "- Retention: 7 days"
            echo "- SPDX generator: \`syft v1.50.0\`"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/release-assets/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish_release:
    name: Publish Release Assets
    needs:
      - prepare
      - approval
      - finalize_candidate
    if: >-
      always() && inputs.publish &&
      needs.prepare.result == 'success' &&
      needs.approval.result == 'success' &&
      needs.finalize_candidate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout immutable release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Release publication token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: write
          permission-metadata: read

      - name: Recheck release tag immutability
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for candidate_tag in "$RELEASE_TAG" "$VERSION"; do
            if git ls-remote --exit-code --tags origin "refs/tags/$candidate_tag" >/dev/null 2>&1; then
              echo "release version already has a tag: $candidate_tag" >&2
              exit 1
            fi
          done

      - name: Download consolidated candidate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-assets-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.commit }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets

      - name: Reverify candidate before publication
        run: >-
          python3 .github/scripts/candidate_evidence.py verify
          --asset-directory release-assets
          --version '${{ needs.prepare.outputs.version }}'
          --source-commit '${{ needs.prepare.outputs.commit }}'

      - name: Create, read back, and publish immutable Release
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_ASSET_DIRECTORY: ${{ github.workspace }}/release-assets
          RELEASE_CHECKSUM_FILE: ${{ github.workspace }}/release-assets/SHA256SUMS
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_NOTES_FILE: ${{ github.workspace }}/release-assets/NATIVE-SIGNING.md
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_TITLE: Camellia Remote Client ${{ needs.prepare.outputs.app_version }}
        run: bash .github/scripts/publish-verified-release.sh
