[project]
name = "camellia-remote-admin"
version = "1.0.1"
description = "Bounded, receipt-aware administration for Camellia Remote Management"
readme = "docs/admin-cli.md"
requires-python = ">=3.13,<3.16"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["requests==2.34.2"]

[project.scripts]
camellia-remote-admin = "camellia_remote_admin.__main__:main"

[build-system]
requires = ["uv_build==0.13.5"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff==0.16.0", "uv_build==0.13.5"]

[tool.uv]
required-version = "==0.13.5"

[tool.uv.build-backend]
module-name = "camellia_remote_admin"
module-root = "tools/admin-cli/src"
source-include = ["uv.lock", "tools/admin-cli/**"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "BLE001", "PLR1722", "DTZ", "PIE"]

[tool.ruff.lint.per-file-ignores]
"tools/admin-cli/tests/**" = ["DTZ", "PLR2004"]
